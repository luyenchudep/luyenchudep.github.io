:root{
  --ink:#1F1B16;--muted:#52473B;--line:#D4C8B4;--soft:#E9E0CE;--bg:#ECE5D5;--paper:#F7F2E7;
  --accent:#184E9E;--accent-ink:#FFFFFF;--hl:#E2ECF9;--toast:#2B251F;--danger:#B81D18;--danger-bg:#FCEAE8;--ok:#157A3B;
}
body.light{
  --ink:#161616;--muted:#4A4A4A;--line:#D4D4D4;--soft:#EBEBEB;--bg:#F0F0EE;--paper:#FFFFFF;
  --accent:#1A56B0;--accent-ink:#FFFFFF;--hl:#E8F0FC;--toast:#222222;--danger:#C41E19;--danger-bg:#FDECEB;--ok:#157A3B;
}
body.dark{
  --ink:#F0EDE6;--muted:#B5BAC2;--line:#353B45;--soft:#252A31;--bg:#111317;--paper:#1B1E23;
  --accent:#82B4FF;--accent-ink:#0F1724;--hl:#233147;--toast:#333942;--danger:#FF7870;--danger-bg:#3B1E1D;--ok:#34C76A;
}
body.eink{
  --ink:#000000;--muted:#222222;--line:#000000;--soft:#F2F2F2;--bg:#FFFFFF;--paper:#FFFFFF;
  --accent:#000000;--accent-ink:#FFFFFF;--hl:#E8E8E8;--toast:#000000;--danger:#000000;--danger-bg:#EDEDED;--ok:#000000;
}
body.eink *{box-shadow:none!important;transition:none!important}
/* Left-handed mode: mirror floating stage controls & workspace split */
body.lefthand #stageTop{flex-direction:row-reverse}
body.lefthand #stageLeft{margin-right:0;margin-left:auto}
body.lefthand #meas{left:auto;right:16px}
body.lefthand #workspace{flex-direction:row-reverse}

/* Universal Tablet Split-View Workspace */
#workspace{flex:1 1 auto;display:flex;min-height:0;overflow:hidden;position:relative}
#sidePane{
  display:none;flex:0 0 340px;max-width:40vw;background:var(--paper);
  border-right:1.5px solid var(--line);overflow:auto;padding:12px 14px;
  touch-action:pan-y;
}
body.lefthand #sidePane{border-right:0;border-left:1.5px solid var(--line)}
#sideTabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px}
#sideTabs button{flex:1;border:0;background:transparent;border-radius:8px;min-height:36px;font-size:13.5px;font-weight:700;color:var(--muted)}
#sideTabs button.on{background:var(--ink);color:var(--paper)}
#bSplit{display:none}
@media (min-width:860px){
  #bSplit{display:inline-flex}
  body.split #sidePane{display:block}
}

/* Auto-Advancing Zoom Box (GoodNotes style) */
#stage{flex:1 1 auto;position:relative;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
#canvasWrap{flex:1 1 auto;position:relative;overflow:hidden;min-height:120px}
#zboxWrap{
  display:none;flex:0 0 42%;min-height:175px;max-height:310px;
  background:var(--paper);border-top:2.5px solid var(--accent);
  position:relative;flex-direction:column;z-index:8;
  box-shadow:0 -4px 16px rgba(0,0,0,.14);
}
#zboxWrap.on{display:flex}
#zboxBar{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:4px 8px;
  background:var(--hl);border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--accent);
}
#zboxBar .zbSp{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zboxBar button{
  border:1px solid var(--accent);background:var(--paper);color:var(--accent);
  border-radius:8px;min-height:32px;min-width:32px;padding:0 8px;font-size:13.5px;font-weight:700;
}
#zboxBar button.x{background:var(--accent);color:var(--accent-ink)}
#zboxStage{flex:1 1 auto;position:relative;overflow:hidden}
#zboxCv,#zboxFx{position:absolute;left:0;top:0;touch-action:none}
#zboxFx{pointer-events:none}

/* Clickable AI Score Pill */
#meas{pointer-events:none!important}
.scoreGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.scCard{background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.scCard b{display:block;font-size:24px;color:var(--accent);line-height:1.2}
.scCard span{font-size:13px;color:var(--muted);font-weight:600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'QS',system-ui,-apple-system,sans-serif;font-weight:500;
  font-size:16px;overflow:hidden;overscroll-behavior:none;
}
button{color:inherit;cursor:pointer;font-family:inherit}
button:active{transform:scale(.97)}
#app{display:flex;flex-direction:column;height:100dvh;width:100%}

/* ===== HEADER MOBILE-FIRST ===== */
header{
  flex:0 0 auto;background:var(--paper);border-bottom:1.5px solid var(--line);
  padding:6px 10px 8px;padding-top:max(6px,env(safe-area-inset-top));
  padding-left:max(10px,env(safe-area-inset-left));
  padding-right:max(10px,env(safe-area-inset-right));
  z-index:10;
}
#topbar{display:flex;align-items:center;gap:6px;min-height:46px}
.ibtn{
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:12px;min-width:44px;height:44px;padding:0 8px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:600;flex:0 0 auto;line-height:1;
}
.ibtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ibtn.sm{min-width:40px;padding:0 6px;font-size:15px}
#bMenu{font-size:21px;background:var(--hl);border-color:var(--accent);color:var(--accent)}
#tbox{
  flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;
  padding:2px 4px;border-radius:10px;text-align:left;background:none;border:0;
}
#tline{display:flex;align-items:center;gap:6px;width:100%}
#ttext{font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:1.25}
#pageinfo{
  font-size:13.5px;font-weight:700;color:var(--accent);background:var(--hl);
  border-radius:10px;padding:2px 8px;white-space:nowrap;flex:0 0 auto;
}
#part{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;margin-top:1px}

#subbar{margin-top:6px}
body.focus #subbar{display:none}
body.focus header{padding-bottom:6px}

#modesRow{display:flex;align-items:center;gap:6px}
#modes{
  flex:1;display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;
  border:1px solid var(--line);
}
#modes button{
  flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;
  padding:6px 4px;font-size:14.5px;font-weight:600;color:var(--muted);white-space:nowrap;
}
#modes button.on{background:var(--ink);color:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.14)}
#done{
  border:1.5px solid var(--line);background:var(--paper);border-radius:12px;
  min-height:46px;padding:0 11px;font-size:14px;font-weight:600;
  color:var(--ink);white-space:nowrap;flex:0 0 auto;
}
#done.on{background:var(--ok);color:#fff;border-color:var(--ok)}
#theme{min-width:46px;height:46px;font-size:19px}

#note{
  font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.4;
  background:var(--soft);padding:6px 10px;border-radius:10px;
}
#session{
  display:none;align-items:center;gap:8px;font-size:14px;
  background:var(--hl);border:1px solid var(--accent);border-radius:12px;
  padding:7px 10px;margin-top:6px;
}
#session.on{display:flex}
#session b{font-weight:700}
#session span{flex:1;line-height:1.3}
#session button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;min-height:38px}
#session button.x{background:transparent;color:var(--muted);padding:6px 10px;font-size:16px}
#warn{
  display:none;font-size:14px;background:#FFF0C2;color:#5C4000;
  border:1px solid #E5C158;border-radius:10px;padding:8px 10px;margin-top:6px;line-height:1.35;
}
body.dark #warn{background:#3B2E10;color:#F5D98E;border-color:#69521B}

/* ===== VÙNG VIẾT CANVAS ===== */
canvas{position:absolute;left:0;top:0;touch-action:none}
#bg{visibility:hidden}
#ink{cursor:crosshair}
#fx{pointer-events:none}

/* Nút nổi đặt GÓC TRÊN PHẢI để né hoàn toàn cổ tay phải */
#stageTop{
  position:absolute;top:8px;right:12px;left:12px;
  display:flex;justify-content:flex-end;align-items:center;flex-wrap:nowrap;gap:6px;
  z-index:6;pointer-events:none;overflow-x:auto;scrollbar-width:none;
}
#stageTop::-webkit-scrollbar{display:none}
#redoBtn{
  display:none;pointer-events:auto;border:1.5px solid var(--line);border-radius:20px;
  min-height:40px;padding:4px 12px;font-size:14.5px;font-weight:700;
  background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.14);flex:0 0 auto;
}
#redoBtn.on{display:inline-flex;align-items:center;gap:4px}
.saveFavBar{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.saveFavBar span{font-size:13px;color:var(--muted);font-weight:600}
.saveFavBar button{
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:10px;min-height:38px;padding:4px 10px;font-size:13.5px;font-weight:700;
}
.saveFavBar button.on{border-color:var(--accent);background:var(--hl);color:var(--accent)}
#zoomPill{
  display:none;pointer-events:auto;margin-right:auto;
  align-items:center;gap:4px;
  background:var(--paper);border:1.5px solid var(--accent);border-radius:22px;
  padding:3px 6px;box-shadow:0 3px 10px rgba(0,0,0,.18);
}
#zoomPill.on{display:inline-flex}
#zoomPill button{
  border:0;background:var(--hl);color:var(--accent);border-radius:16px;
  min-width:34px;height:36px;padding:0 10px;font-size:14.5px;font-weight:700;
}
#zoomPill .zreset{background:var(--accent);color:var(--accent-ink);padding:0 12px}
#stageLeft{display:flex;align-items:center;gap:6px;margin-right:auto;flex-wrap:nowrap;pointer-events:none;flex:0 0 auto}
#favDock{
  display:none;pointer-events:auto;align-items:center;gap:5px;
  background:var(--paper);border:1.5px solid var(--line);border-radius:22px;
  padding:3px 6px;box-shadow:0 2px 8px rgba(0,0,0,.12);
}
#favDock.on{display:inline-flex}
.fdot{
  width:36px;height:36px;border-radius:50%;border:2px solid transparent;
  background:var(--soft);display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;position:relative;padding:0;
}
.fdot.on{border-color:var(--accent);background:var(--hl);box-shadow:0 0 0 1.5px var(--accent)}
.fdot em{
  position:absolute;right:2px;bottom:2px;width:10px;height:10px;border-radius:50%;
  border:1.5px solid var(--paper);display:block;
}
.penGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.pcard{
  border:1.5px solid var(--line);background:var(--paper);border-radius:14px;
  padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  text-align:center;min-height:76px;justify-content:center;
}
.pcard.on{border-color:var(--accent);background:var(--hl);box-shadow:0 0 0 1px var(--accent)}
.pcard .pic{font-size:23px;line-height:1.1}
.pcard .pnm{font-size:14.5px;font-weight:700;color:var(--ink)}
.pcard .psb{font-size:11.5px;color:var(--muted);line-height:1.2}
.favRow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 10px}
.fslot{
  border:1.5px solid var(--line);background:var(--soft);border-radius:12px;
  padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12.5px;font-weight:700;min-height:62px;justify-content:center;
}
.fslot.on{border-color:var(--accent);background:var(--hl)}
.fslot .fbar{width:26px;height:6px;border-radius:4px;margin-top:2px}
.swGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;justify-items:center;margin:8px 0 4px;width:100%}
.swPick{
  width:40px;height:40px;border-radius:50%;border:2.5px dashed var(--accent);
  display:inline-flex;align-items:center;justify-content:center;font-size:18px;
  position:relative;overflow:hidden;background:var(--soft);cursor:pointer;
}
.swPick input{position:absolute;inset:-8px;opacity:0;cursor:pointer;width:60px;height:60px}
.wPills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 8px;width:100%}
.wpill{
  border:1.5px solid var(--line);background:var(--soft);border-radius:10px;
  min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12.5px;font-weight:700;color:var(--ink);
}
.wpill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wpill span{display:block;border-radius:99px;width:24px;background:currentColor}
.meter{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;margin:4px 0 8px;border:1px solid var(--line)}
.meter>div{height:100%;background:var(--accent);transition:width .06s}
#cmp{
  display:none;pointer-events:auto;border:1.5px solid var(--ink);border-radius:22px;
  min-height:46px;padding:8px 18px;font-size:15.5px;font-weight:700;
  background:var(--ink);color:var(--paper);box-shadow:0 3px 10px rgba(0,0,0,.22);
}
#cmp.on{display:inline-flex;align-items:center;gap:6px}
#cmp.act{background:var(--danger);border-color:var(--danger);color:#fff}
#grade{display:none;gap:8px;pointer-events:auto}
#grade.on{display:flex}
#grade button{
  border:1.5px solid var(--line);border-radius:22px;min-height:46px;
  padding:8px 15px;font-size:15px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18);
}
#grade .ok{background:var(--ok);border-color:var(--ok);color:#fff}
#grade .no{background:var(--paper);color:var(--ink);border-color:var(--ink)}

/* Thanh đo góc nghiêng góc dưới trái (không vướng tay phải) */
#meas{
  position:absolute;left:16px;bottom:10px;
  font-size:13.5px;font-weight:600;color:var(--ink);
  background:var(--paper);border:1.5px solid var(--line);
  border-radius:12px;padding:6px 12px;display:none;z-index:4;
  pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.08);
  max-width:calc(100% - 32px);
}
#meas.on{display:block}

/* ===== THANH CÔNG CỤ ĐÁY 5 NÚT LỚN ===== */
footer{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  background:var(--paper);border-top:1.5px solid var(--line);
  padding:6px 8px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));
  padding-left:max(8px,env(safe-area-inset-left));
  padding-right:max(8px,env(safe-area-inset-right));
  z-index:10;
}
.tb{
  background:transparent;border:1.5px solid transparent;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;min-height:58px;padding:5px 2px;border-radius:14px;position:relative;
}
.tb b{font-size:23px;line-height:24px;font-weight:600;display:flex;align-items:center;gap:4px}
.tb i{font-style:normal;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tb.on{background:var(--hl);border-color:var(--accent)}
.tb.on b,.tb.on i{color:var(--accent)}
.tb:disabled{opacity:.32;pointer-events:none}
#penDot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid var(--paper);box-shadow:0 0 0 1px var(--ink)}

/* ===== CHẾ ĐỘ XOAY NGANG ĐIỆN THOẠI ===== */
@media (orientation:landscape) and (max-height:520px){
  header{padding:4px 10px}
  #topbar{min-height:40px}
  .ibtn{height:38px;min-width:38px;font-size:15px}
  #part,#note{display:none!important}
  #subbar{margin-top:4px}
  #modes button{min-height:34px;padding:4px;font-size:13.5px}
  #done,#theme{min-height:38px;height:38px;font-size:13.5px}
  footer{padding:4px 10px;padding-bottom:max(4px,env(safe-area-inset-bottom))}
  .tb{flex-direction:row;gap:6px;min-height:44px}
  .tb b{font-size:19px}
  .tb i{font-size:13.5px}
}

/* ===== BẢNG CHỌN BOTTOM SHEET (TO, RÕ CHO MẮT 46+) ===== */
.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.52);
  display:none;z-index:50;align-items:flex-end;justify-content:center;
}
.sheet.open{display:flex}
.box{
  background:var(--paper);color:var(--ink);width:100%;max-width:600px;
  max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  touch-action:pan-y;border-top:2px solid var(--line);
}
.box h3{margin:0 0 10px;font-size:21px;font-weight:700;line-height:1.3}
.prog{font-size:15px;color:var(--muted);margin-bottom:12px;line-height:1.45}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar>div{height:100%;background:var(--accent)}
.ph{font-size:14px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.3px;margin:20px 0 6px}
.li{
  display:flex;align-items:center;gap:12px;padding:14px 10px;min-height:54px;
  border-bottom:1px solid var(--soft);font-size:17px;border-radius:10px;
}
.li.cur{background:var(--hl);font-weight:700;border-bottom-color:transparent}
.li .ck{width:24px;text-align:center;font-size:18px;font-weight:700;color:var(--ok);flex:0 0 auto}
.li .sz{
  margin-left:auto;font-size:13px;font-weight:600;color:var(--muted);
  background:var(--soft);padding:3px 9px;border-radius:10px;flex:0 0 auto;
}
.row{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:13px 0;border-bottom:1px solid var(--soft);font-size:16px;font-weight:600;gap:10px;
}
.seg{
  display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0;
  background:var(--soft);
}
.seg button{
  border:0;background:transparent;color:var(--ink);
  font-size:14.5px;font-weight:600;padding:10px 13px;min-height:44px;
}
.seg button.on{background:var(--ink);color:var(--paper)}
.btn{
  display:block;width:100%;margin-top:12px;padding:15px 16px;min-height:52px;
  border:0;border-radius:14px;background:var(--ink);color:var(--paper);
  font-size:16.5px;font-weight:700;text-align:center;
}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid var(--danger)}
.btn.danger.arm{background:var(--danger);color:#fff}

textarea{
  width:100%;min-height:160px;font:inherit;font-size:17px;line-height:1.5;
  padding:12px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--paper);color:var(--ink);
}
.swWrap{display:flex;align-items:center;gap:12px}
.sw{
  width:40px;height:40px;border-radius:50%;border:3px solid var(--paper);
  box-shadow:0 0 0 1.5px var(--line);display:inline-block;cursor:pointer;
}
.sw.on{box-shadow:0 0 0 3px var(--accent);transform:scale(1.06)}

.stepper{display:flex;align-items:center;gap:8px}
.stepper button{
  width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--soft);font-size:20px;font-weight:700;line-height:1;
}
.stepper input[type=range]{width:120px;height:36px;accent-color:var(--accent)}
.stepper b{min-width:34px;text-align:center;font-size:16px}

#demo{
  position:static;display:block;width:100%;height:88px;
  border:1.5px solid var(--line);border-radius:12px;margin-top:8px;
  touch-action:none;background:var(--paper);
}

/* ===== THẺ SỔ TAY & HOẠT ẢNH BÚT VIẾT MẪU ===== */
.card canvas{
  position:static;display:block;width:100%;
  border:1.5px solid var(--line);border-radius:12px;margin:10px 0;background:var(--paper);
}
.card h4{margin:16px 0 6px;font-size:17px;font-weight:700;color:var(--accent)}
.card p,.card li{font-size:16px;line-height:1.55;margin:6px 0}
.card ul{padding-left:22px;margin:6px 0}
.card .goal{
  font-size:16.5px;font-weight:600;background:var(--hl);border-left:4px solid var(--accent);
  border-radius:10px;padding:10px 12px;margin:8px 0;line-height:1.45;
}
.leg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted);margin:6px 0}
.leg span{display:flex;align-items:center;gap:6px}
.leg .dot{
  width:20px;height:20px;border-radius:50%;background:#d21f1a;color:#fff;
  font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-style:normal;
}
.leg .ln{width:26px;border-top:2.5px solid #d21f1a}
.leg .ln.d{border-top-style:dashed}

.animBox{
  background:var(--soft);border:1.5px solid var(--line);border-radius:14px;
  padding:12px;margin:10px 0;
}
.animChips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.animChip{
  min-width:44px;min-height:44px;padding:4px 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  font-size:16px;font-weight:700;
}
.animChip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.animCtrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.animCtrl button{
  flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);font-size:15px;font-weight:700;padding:6px 10px;
}
.animCtrl button.play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#animInfo{font-size:14.5px;font-weight:600;color:var(--muted);text-align:center;margin-top:6px;min-height:22px}
#animInfo.ok{color:var(--ok)}
#animInfo.err{color:var(--danger)}
.animTabs{display:flex;gap:4px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.animTabs button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:9px;min-height:42px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.animTabs button .i{width:18px;height:18px}
.animTabs button.on{background:var(--accent);color:var(--accent-ink)}
.animChip.done{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.animChip.done::after{content:" ✓";font-size:13px;color:var(--ok)}
.animChip.on.done::after{color:var(--accent-ink)}
#animCv.quizOn{touch-action:none;cursor:crosshair}
.sideAct{display:flex;gap:8px;margin-top:12px}
.sideAct .btn{margin-top:0;flex:1;padding:12px 8px;font-size:14.5px}

.due{color:var(--danger);font-size:14px;font-weight:700}
.papers img{width:100%;border:1.5px solid var(--line);border-radius:10px;display:block;background:#fff}
.papers figure{margin:0 0 12px;font-size:14px;color:var(--muted)}
.jl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jl figure{margin:0;font-size:13.5px;color:var(--muted)}
.jl img{width:100%;border:1.5px solid var(--line);border-radius:10px;display:block;background:#fff}
#ptest{
  position:static;width:100%;height:200px;border:1.5px solid var(--line);
  border-radius:12px;touch-action:none;display:block;background:var(--paper);
}
.kv{font-size:15.5px;line-height:1.8}
.kv b{display:inline-block;min-width:170px;font-weight:600;color:var(--muted)}

#toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--toast);color:#fff;
  padding:11px 20px;border-radius:20px;font-size:15px;font-weight:600;
  opacity:0;transition:opacity .22s;pointer-events:none;z-index:80;
  max-width:92vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.28);
}

/* ================== GIAO DIỆN TỐI GIẢN ================== */
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;display:inline-block;vertical-align:middle}
.i .f{fill:currentColor;stroke:none}
body.accK{--accent:var(--ink);--accent-ink:var(--paper);--hl:var(--soft)}
button,.li,.tile,.hero{transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s,transform .1s}
button{-webkit-user-select:none;user-select:none}
/* thanh trên: một hàng trên máy rộng, hai hàng trên điện thoại dọc */
header{padding:6px 10px 6px}
#topbar{flex-wrap:wrap;row-gap:6px;column-gap:6px;min-height:44px}
#bMenu,#bMenu.ibtn{order:1}
#tbox{order:2;flex:1 1 0;cursor:pointer;min-height:44px}
#bZBox{order:4}#bAa{order:5}
#modesRow{order:6;flex:1 1 100%;display:flex;align-items:center;gap:6px}
@media (min-width:700px){#modesRow{order:3;flex:0 1 430px}}
.ibtn{border:0;background:transparent;color:var(--ink);border-radius:12px;min-width:44px;width:44px;height:44px;padding:0}
.ibtn:active,.ibtn:hover{background:var(--soft)}
.ibtn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#bMenu{background:transparent;border:0;color:var(--ink)}
#ttext{font-size:16px}
#part{display:flex;gap:6px;align-items:center;font-size:12.5px}
#partTxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#pageinfo{font-size:12px;padding:1px 7px;border-radius:8px;flex:0 0 auto}
#modes{border:0;background:var(--soft);border-radius:12px;padding:3px}
#modes button{min-height:44px;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
#modes button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.n{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:1.5px solid currentColor;font-size:11.5px;font-weight:700;line-height:1;flex:0 0 auto}
#done{min-height:48px;height:48px;border:0;background:var(--soft);display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:12px}
#done.on{background:var(--ok);color:#fff}
#subbar{margin-top:0}
#note{display:flex;align-items:flex-start;gap:8px;margin-top:6px;padding:6px 10px;font-size:14px;cursor:pointer}
#note .i{width:18px;height:18px;margin-top:1px;color:var(--accent)}
#note span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#note.open span{white-space:normal}
body.focus #modesRow{display:none}
/* vùng viết */
#redoBtn{border:0;background:var(--paper);gap:6px;min-height:44px}
#cmp{border:0;background:var(--accent);color:var(--accent-ink);min-height:44px;gap:6px}
#cmp.act{background:var(--danger);color:#fff}
#grade .no{border-color:var(--line)}
#zboxBar button{min-height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
#zboxBar .i{width:20px;height:20px}
#zbTitle{display:flex;align-items:center;gap:6px}
#sideTabs button{min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px}
#sideTabs button.on{background:var(--accent);color:var(--accent-ink)}
#meas .i{width:16px;height:16px;margin-right:4px;vertical-align:-3px}
/* thanh dưới */
.tb{border:0;gap:3px}
.tb b{height:26px}
.tb b .i{width:25px;height:25px}
.tb i{font-size:12.5px}
.tb.on{background:var(--hl);border:0}
#penDot{width:9px;height:9px;margin-left:-6px;margin-top:12px}
#bPen{touch-action:none}
/* bảng chọn */
.sheet .box{animation:sheetUp .2s ease-out}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.box::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 12px}
.seg{border:0;background:var(--soft);padding:3px;border-radius:12px;gap:2px}
.seg button{border-radius:9px;min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.btn{background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{border:0;background:var(--soft)}
.wpill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pcard .pic .i{width:28px;height:28px}
.fslot span .i{width:16px;height:16px;vertical-align:-3px}
.box h3 .i{width:22px;height:22px;vertical-align:-4px}
.card h4 .n{margin-right:6px;vertical-align:1px}
.animCtrl button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.animCtrl .i{width:18px;height:18px}
/* danh mục */
.mHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px}
.mHead h3{margin:0}
.hero{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:18px;padding:14px 16px;margin:6px 0 12px;background:var(--accent);color:var(--accent-ink);text-align:left}
.hero .hIc{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hero .hIc .i{width:24px;height:24px}
.hero b{display:block;font-size:17.5px;font-weight:700}
.hero small{display:block;font-size:13.5px;opacity:.85;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin:0 0 6px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:0;border-radius:14px;padding:12px;background:var(--soft);color:var(--ink);text-align:left;min-height:84px}
.tile .i{width:24px;height:24px;color:var(--accent)}
.tile b{font-size:14.5px;font-weight:700;line-height:1.25}
.tile small{font-size:12px;color:var(--muted);line-height:1.25}
.tile .badge{position:absolute;top:10px;right:10px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.li{gap:12px;border-bottom:0;border-radius:12px;padding:10px;min-height:50px;font-size:16px}
.li .ck{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.li .ck .i{width:22px;height:22px}
.li .ck.d{color:var(--ok)}
.li .ck.o{color:var(--line)}
.li.cur .ck.o{color:var(--accent)}
.li .sz{font-size:12px;background:var(--soft);padding:2px 8px}
details.grp{border-radius:14px;background:var(--soft);margin:8px 0;padding:0 12px}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;font-size:16px;font-weight:700;cursor:pointer}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.grp[open]>summary::after{transform:rotate(-135deg)}
details.grp>summary .i{color:var(--accent)}
details.grp .row{border-bottom-color:var(--line)}
details.grp .seg{background:var(--paper)}
details.grp .btn{background:var(--paper)}
/* bảng nổi nhỏ (Aa, bút nhanh) */
#popLayer{position:fixed;inset:0;z-index:60;display:none}
#popLayer.open{display:block}
#popBox{position:fixed;background:var(--paper);color:var(--ink);border-radius:18px;padding:12px;box-shadow:0 10px 32px rgba(0,0,0,.24),0 0 0 1px var(--line);width:min(320px,calc(100vw - 16px));animation:popIn .14s ease-out;max-height:calc(100dvh - 24px);overflow:auto}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.popT{font-size:12.5px;font-weight:700;color:var(--muted);margin:6px 2px 6px;letter-spacing:.2px}
.stepRow{display:flex;align-items:center;gap:8px}
.stepRow button{width:48px;height:44px;border:0;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.stepRow b{flex:1;text-align:center;font-size:17px}
.papers4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.papers4 button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px;min-height:58px}
.papers4 span{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 1.5px var(--line);display:block;background-image:linear-gradient(transparent 44%,rgba(128,110,90,.55) 44% 48%,transparent 48% 64%,rgba(128,110,90,.35) 64% 67%,transparent 67%)!important}
.papers4 button.on span{box-shadow:0 0 0 2.5px var(--accent)}
.popSeg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.popSeg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;font-size:14px;font-weight:600}
.popSeg button.on{background:var(--accent);color:var(--accent-ink)}
.popBtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--soft);border-radius:12px;min-height:46px;padding:0 12px;margin-top:10px;font-size:14.5px;font-weight:600;text-align:left}
.favPick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.favPick button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);padding:2px}
.favPick .fc{width:48px;height:48px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.favPick .fc em{position:absolute;right:3px;bottom:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--paper)}
.favPick button.on .fc{box-shadow:0 0 0 2.5px var(--accent)}
.favPick button.on{color:var(--accent)}
/* thông báo nằm trong dải trên vùng viết, không che dòng cuối */
#toast{bottom:auto;transform:none;left:12px;max-width:min(520px,calc(100vw - 170px));font-size:14px;padding:9px 14px;border-radius:14px;text-align:left}
/* điện thoại xoay ngang: một thanh trên mỏng */
@media (orientation:landscape) and (max-height:520px){
  header{padding:3px 10px}
  #topbar{min-height:44px;flex-wrap:nowrap}
  #modesRow{order:3;flex:0 1 380px}
  .ibtn{height:44px;min-width:44px}
  #part{display:flex!important}
  #ttext{font-size:15px}
  #modes button{min-height:44px;font-size:13.5px}
  #modes{padding:1px}
  #done{min-height:44px;height:44px;min-width:44px;padding:0 10px}
  #done .dl{display:none}
  #note{display:none!important}
  #stageTop{top:4px}
  footer{padding:3px 10px;padding-bottom:max(3px,env(safe-area-inset-bottom))}
  /* thanh công cụ thành cột dọc bên trái (tay trái: bên phải) để vùng viết cao hơn */
  #app{display:grid;grid-template-columns:72px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  header{grid-column:1/3;grid-row:1}
  #workspace{grid-column:2;grid-row:2}
  footer{grid-column:1;grid-row:2;grid-template-columns:1fr;grid-template-rows:repeat(5,minmax(0,1fr));gap:2px;border-top:0;border-right:1.5px solid var(--line);padding:4px 3px;padding-left:max(3px,env(safe-area-inset-left));padding-bottom:max(4px,env(safe-area-inset-bottom))}
  body.lefthand #app{grid-template-columns:minmax(0,1fr) 72px}
  body.lefthand #workspace{grid-column:1}
  body.lefthand footer{grid-column:2;border-right:0;border-left:1.5px solid var(--line);padding-left:3px;padding-right:max(3px,env(safe-area-inset-right))}
  .tb{flex-direction:column;gap:1px;min-height:0;padding:2px}
  .tb b{height:24px}
  .tb b .i{width:22px;height:22px}
  .tb i{font-size:11px}
}
@media (max-width:380px){#modes button .n{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.eink *{animation:none!important}
body.eink .hero{border:2px solid #000}

/* ================== DANH MỤC 3 THẺ, PHẦN GẬP ĐƯỢC ================== */
.mTabs{position:sticky;top:-18px;z-index:3;display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin:0 0 12px;box-shadow:0 -14px 0 6px var(--paper),0 6px 0 0 var(--paper)}
.mTabs button{flex:1;border:0;background:transparent;border-radius:10px;min-height:44px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);position:relative}
.mTabs button .i{width:19px;height:19px}
.mTabs button.on{background:var(--accent);color:var(--accent-ink)}
.mTabs .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);position:absolute;top:7px;right:9px}
details.part{border-radius:14px;margin:6px 0;background:var(--soft)}
details.part>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;cursor:pointer}
details.part>summary::-webkit-details-marker{display:none}
details.part>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-left:2px}
details.part[open]>summary::after{transform:rotate(-135deg)}
details.part .pn{flex:1;font-size:15px;font-weight:700;color:var(--ink);line-height:1.3}
details.part .pc{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--paper);border-radius:10px;padding:2px 9px}
details.part .pc.full{background:var(--ok);color:#fff}
details.part.cur .pn{color:var(--accent)}
details.part[open]{padding:0 6px 6px}
details.part[open]>summary{padding:0 8px}
details.part .li{background:var(--paper);margin:4px 0}
details.part .li.cur{background:var(--hl)}
#sideBody details.part .li{min-height:44px;font-size:15px;padding:8px}
#menu .box{height:min(88dvh,940px)}

</style>
</head>
<body>
<div id="app">
  <header>
    <div id="topbar">
      <button class="ibtn" id="bMenu" onclick="openMenu()" aria-label="Danh mục bài và cài đặt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button id="tbox" onclick="openCard()" aria-label="Mở sổ tay bài học">
        <div id="tline"><span id="ttext"></span></div>
        <div id="part"><span id="partTxt"></span><span id="pageinfo"></span></div>
      </button>
      <div id="modesRow">
        <div id="modes">
          <button id="mXem" onclick="openCard()"><span class="n">1</span>Xem</button>
          <button id="mTo" onclick="setMode('to')"><span class="n">2</span>Tô</button>
          <button id="mNho" onclick="setMode('nho')"><span class="n">3</span>Chép</button>
        </div>
        <button id="done" onclick="toggleDone()" aria-label="Đánh dấu đã tập"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.8 2.8L16.2 9.8"/></svg><span class="dl">Đã tập</span></button>
      </div>
      <button class="ibtn" id="bZBox" onclick="toggleZBox()" aria-label="Hộp viết phóng to tự trượt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20 20M10.5 8v5M8 10.5h5"/></svg></button>
      <button class="ibtn" id="bAa" onclick="openAa()" aria-label="Cỡ dòng, màu giấy, toàn màn hình"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19 8.4 5h1.2L15 19M5.2 14.2h7.6"/><circle cx="18.4" cy="15.6" r="2.6"/><path d="M21 12.6V19"/></svg></button>
    </div>
    <div id="subbar">
      <div id="note" onclick="this.classList.toggle('open');setTimeout(resize,30)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.2M12 7.8v.1"/></svg><span id="noteTxt"></span></div>
      <div id="session"><span id="sessTxt"></span><button onclick="sessNext()">Tiếp ›</button><button class="x" onclick="sessEnd()" aria-label="Kết thúc buổi tập">✕</button></div>
      <div id="warn">Đang mở tệp trực tiếp nên trình duyệt không lưu được bài viết và tiến độ. Hãy mở bằng đường dẫn để ứng dụng tự lưu.</div>
    </div>
  </header>

  <div id="workspace">
    <aside id="sidePane">
      <div id="sideTabs">
        <button id="stXem" class="on" onclick="setSideTab('xem')"><span class="n">1</span>Xem mẫu</button>
        <button id="stList" onclick="setSideTab('list')"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Mục lục</button>
      </div>
      <div id="sideBody" class="card"></div>
    </aside>
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="bg"></canvas><canvas id="ink"></canvas><canvas id="fx"></canvas>
        <div id="stageTop">
          <div id="stageLeft">
            <div id="favDock"></div>
            <div id="zoomPill">
              <button onclick="zoomStep(-0.35)" aria-label="Thu nhỏ trang giấy">−</button>
              <button class="zreset" id="zoomVal" onclick="resetZoom()" aria-label="Thu về 100%">100%</button>
              <button onclick="zoomStep(0.35)" aria-label="Phóng to trang giấy">+</button>
            </div>
          </div>
          <button id="redoBtn" onclick="redo()" aria-label="Làm lại nét vừa hoàn tác"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>Làm lại</button>
          <div id="grade">
            <button class="ok" onclick="grade(true)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg> Đạt</button>
            <button class="no" onclick="grade(false)">Luyện thêm</button>
          </div>
          <button id="cmp" onclick="toggleCompare()"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="cmpTxt">So sánh</span></button>
        </div>
        <div id="meas" onclick="openScoreReport()" title="Chạm để xem phân tích chi tiết nét viết"></div>
      </div>
      <div id="zboxWrap">
        <div id="zboxBar">
          <span class="zbSp" id="zbTitle"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 20 20M10.5 8v5M8 10.5h5"/></svg>Hộp viết tự trượt (2,4×)</span>
          <button onclick="zboxMove(-1)" aria-label="Lùi trái"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7"/></svg></button>
          <button onclick="zboxMove(1)" aria-label="Tiến phải"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg></button>
          <button onclick="zboxNextLine()" aria-label="Xuống dòng dưới"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v6a3 3 0 0 1-3 3H6M9.5 10.5 6 14l3.5 3.5"/></svg></button>
          <button onclick="zboxScale(-0.3)" aria-label="Thu nhỏ"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button onclick="zboxScale(0.3)" aria-label="Phóng to"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="x" onclick="toggleZBox()" aria-label="Đóng hộp viết"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div id="zboxStage"><canvas id="zboxCv"></canvas><canvas id="zboxFx"></canvas></div>
      </div>
    </div>
  </div>

  <footer>

"]],"d4":["Thanh hỏi, ngã.",["Viết nhỏ, nằm gọn trong nửa thân chữ phía trên."],["Dấu hỏi to như chữ s.","Dấu ngã chạm mũ."]],"d5":["Dấu chồng.",["Mũ đặt trước; dấu thanh đặt sau, lệch nhẹ sang phải mũ."],["Dấu thanh đè lên mũ."]],"d6":["Vị trí dấu thanh.",["Kiểu bỏ dấu quen dùng: vần oa, oe, uy không có âm cuối thì dấu ở chữ đầu (hòa, khỏe, thủy); có âm cuối thì dấu ở chữ sau (hoàn, khoét, huých).","Vần ươ, iê, uô thì dấu ở chữ thứ hai: người, được, biển, muốn."],["Viết sai: thừơng, ngòai, qủa."]],"w1":["Viết từ hai tiếng.",["Hai tiếng cách nhau bằng một chữ o."],["Khoảng cách giữa hai tiếng lúc rộng lúc hẹp."]],"w2":["Địa danh viết hoa đầu mỗi tiếng.",["Chữ hoa đứng riêng, chữ thường bắt đầu sát bên."],["Quên viết hoa tiếng thứ hai."]],"w3":["Từ có nhiều dấu.",["Viết hết từ, rồi thêm dấu từ trái sang phải."],["Thêm dấu ngay khi đang viết làm đứt nét."]],"w4":["Tiếng Pháp — écriture anglaise.",["Dấu é, è, à viết như dấu sắc, huyền."],["Quên dấu nối ' trong l'oiseau."]],"q1":["Câu ngắn cỡ vừa.",["Giữ cùng một độ nghiêng từ đầu đến cuối câu."],["Cuối câu chữ nhỏ dần."]],"q2":["Câu dài hai vế.",["Dấu phẩy nhỏ, sát chữ trước."],["Dấu câu cách xa chữ."]],"q3":["Câu tiếng Pháp.",["Viết chậm, chú ý chữ hoa đầu câu."],[]],"k1":["Câu thơ ở cỡ chữ thật.",["Xoay ngang máy để câu thơ nằm trọn một dòng."],["Viết to dần khi viết lâu."]],"free":["Chép tự do.",["Dùng nội dung bạn thích để luyện đều tay."],[]],"v1":["Chữ nét đều để ghi chép.",["Không nhấn, giữ dáng và độ nghiêng."],["Bỏ mất độ nghiêng khi viết nhanh."]],"v2":["Chữ giản lược.",["Bỏ vòng, móc trang trí; giữ nét chính."],["Giản lược đến mức khó đọc."]],"v3":["Từ hay dùng.",["Viết liền cả từ, thêm dấu sau cùng."],[]],"v4":["Viết tắt nhất quán.",["Chọn một bộ viết tắt và giữ nguyên."],["Mỗi lần viết tắt một kiểu."]],"v5":["Ghi chép Cornell.",["Ghi bài ở cột phải.","Sau buổi học: viết câu hỏi ở cột trái, tóm tắt ở dưới."],["Bỏ qua phần tóm tắt."]],"k2":["Câu thơ ở cỡ chữ thật.",["Xoay ngang máy để câu thơ nằm trọn một dòng."],["Viết to dần khi viết lâu."]],"k3":["Câu thơ ở cỡ chữ thật.",["Xoay ngang máy để câu thơ nằm trọn một dòng."],["Viết to dần khi viết lâu."]],"k4":["Câu thơ ở cỡ chữ thật.",["Xoay ngang máy để câu thơ nằm trọn một dòng."],["Viết to dần khi viết lâu."]]},"NHAPMON":[{"t":"Ba thành phần của nét","p":["Mỗi chữ thanh đậm gồm ba phần: <b>nét đậm</b> (kéo xuống, nhấn bút), <b>nét nối</b> (đưa lên, nhẹ tay, mảnh như sợi chỉ) và <b>nét chuyển</b> ở giữa hai loại trên.","Nét đậm luôn bắt đầu và kết thúc bằng nét mảnh: tăng lực dần, rồi thả lực dần. Đừng nhấn hết lực ngay từ điểm đặt bút.","Mọi nét đậm trên trang nên có cùng một độ dày."],"demo":["~down","~under","~oval"]},{"t":"Tỉ lệ theo thân chữ","p":["<b>Thân chữ</b> là khoảng giữa đường chân (đậm) và đường nét đứt. Mọi tỉ lệ khác đều tính theo thân chữ.","Khuyết trên (l, h, b, k) vươn lên chạm đường mờ trên cùng; đuôi và khuyết dưới (g, j, y, p) chạm đường chấm dưới cùng.","Dấu thanh đặt cao hơn thân chữ khoảng nửa thân. Các chữ cách nhau khoảng nửa thân chữ."],"demo":["l","g"]},{"t":"Độ nghiêng và cách đặt máy","p":["Mọi nét đậm song song với các đường xiên mờ trên trang.","Mẹo của trường Pháp xưa: xoay vở để nét đậm trở thành động tác kéo thẳng về phía mình. Trên điện thoại, hãy nghiêng máy sang trái một chút cho các đường xiên gần như dựng đứng trước mặt.","Khi viết nhanh dần, độ nghiêng phải giữ nguyên — đó là thứ làm trang chữ đều."]},{"t":"Tư thế và cầm bút","p":["Ngồi thẳng, hai vai cân, không tì ngực vào bàn. Tay kia giữ máy và xoay máy khi cần.","Cầm bút bằng ba ngón, cong nhẹ và <b>thả lỏng</b>. Nghiên cứu hiện đại cho thấy 4 kiểu cầm bút phổ biến đều cho chữ đẹp như nhau — điều quan trọng là không cầm quá chặt.","Mẹo kiểm tra: cầm nhẹ đến mức người khác có thể rút bút ra khỏi tay bạn."]},{"t":"Cách tập: xem, tô mờ dần, chép, ôn theo trí nhớ","p":["<b>① Xem:</b> chạm nút ① Xem (hoặc tiêu đề bài). Chấm xanh có số là điểm đặt bút và thứ tự nét; mũi tên đỏ ngắn chỉ hướng viết; chấm đỏ nhỏ là điểm dừng bút.","<b>② Tô</b> theo thang 3 bậc, mẫu mờ dần: <b>tô rõ</b> (chữ xám đầy đủ) → <b>tô mờ</b> (chữ xám rất nhạt) → <b>gợi ý</b> (chỉ còn chấm xanh đặt bút). Sau mỗi chữ là vài từ ngắn có chữ đó.","<b>③ Chép:</b> chữ mẫu đen đúng kiểu chữ đặt ở đầu dòng; nhìn mẫu rồi chép tiếp sang phải và xuống các dòng trống. Viết xong chạm <b>So sánh</b> để chồng nét đỏ đối chiếu, rồi tự chấm <b>Đạt</b> hoặc <b>Luyện thêm</b>.","<b>Bài ôn</b> (trong Danh mục) ẩn hẳn chữ mẫu, chỉ ghi tên chữ ở cuối dòng: đây mới là viết theo trí nhớ thật. Chữ <b>Đạt</b> sẽ tự quay lại trong Bài ôn sau 1, 3, 7, 14 và 30 ngày. Chữ <b>Cần luyện thêm</b> vào mục Luyện thêm, tập đến khi đạt.","Vì sao? Mũi tên có số kết hợp viết lại theo trí nhớ giúp tay lưu một \"chương trình chuẩn\" cho mỗi chữ; mẫu mờ dần giúp tay tự làm chủ thay vì chỉ chạy theo vệt xám.","Thói quen gợi ý: 15 phút mỗi ngày qua nút <b>Buổi tập hôm nay</b>; mỗi 2 tuần viết một câu trên giấy để đo tiến bộ thật."]}],"WORDS":{"i":["im","ủi"],"u":["cau","dịu"],"w":["watt","wagon"],"t":["mứt","tím"],"n":["in","nụ"],"m":["mứt","tím"],"v":["vui","vì"],"x":["xe","xưa"],"z":["zoo","zéro"],"o":["voi","dao"],"a":["cau","lúa"],"c":["cau","ốc"],"e":["xe","kem"],"d":["dao","dịu"],"g":["gió","ông"],"q":["quà","quê"],"p":["họp","phà"],"l":["lúa","lời"],"b":["bữa","ba"],"h":["ghi","hoa"],"k":["kem","khế"],"f":["fin","fée"],"j":["joli","jour"],"y":["bảy","cây"],"r":["rau","tre"],"s":["sen","sáo"],"P":["Pleiku","Phú Quốc"],"B":["Bình","Bến Tre"],"R":["Rồng","Rạch Giá"],"F":["Fanny"],"T":["Tuấn","Tây Ninh"],"I":["Im"],"J":["Jean"],"S":["Sa Pa","Sài Gòn"],"G":["Gia Lai","Gò Công"],"O":["Oanh"],"C":["Cà Mau","Cần Thơ"],"E":["Em"],"D":["Dung","Di Linh"],"Q":["Quế","Quy Nhơn"],"L":["Long An","Lạng Sơn"],"A":["Anh","An"],"M":["Mai","Mỹ Tho"],"N":["Nam","Nha Trang"],"V":["Vinh","Vũng Tàu"],"W":["Wagner"],"H":["Huế","Hà Nội"],"K":["Kiên","Kon Tum"],"U":["Uyên","U Minh"],"X":["Xuân"],"Y":["Yên Bái"],"Z":["Zola"],"ă":["năm","chăn"],"â":["cây","mây"],"ê":["quê","yên"],"ô" const ARROW={red:"#c91c17",redDark:"#ff7870",off:.27};
function aCatmull(p,n=14){
  if(p.length<3){const[a,b]=[p[0],p[p.length-1]];return Array.from({length:n+1},(_,t)=>[a[0]+(b[0]-a[0])*t/n,a[1]+(b[1]-a[1])*t/n])}

    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      o.push([0,1].map(j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)))}}

function aOffset(p,s){return p.map((q,i)=>{const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)];
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;return[q[0]-s*dy/L*ARROW.off,q[1]+s*dx/L*ARROW.off]})}

  let q=st?cut(p,st):p;if(en)q=cut(q.slice().reverse(),en).reverse();return q}

function fnt(fs,fam){const F=FONTS[fam||SC.font];return `${F.wt} ${fs}px '${F.fam}'`}
function mw(t,fs,fam){bctx.font=fnt(fs,fam);return bctx.measureText(t).width}

function wrap(text,maxW,fs,fam){
  if(mw(text,fs,fam)<=maxW)return [text];
  const words=text.split(" ");let best=null;
  for(let k=1;k<words.length;k++){const a=words.slice(0,k).join(" "),b=words.slice(k).join(" ");
    const m=Math.max(mw(a,fs,fam),mw(b,fs,fam));if(m<=maxW&&(!best||m<best.m))best={m,l:[a,b]}}
  if(best)return best.l;
  let lines=[],line="";
  for(const w of words){const t=line?line+" "+w:w;if(mw(t,fs,fam)<=maxW||!line)line=t;else{lines.push(line);line=w}}
  if(line)lines.push(line);return lines;
}
/* bài ôn: chữ lấy ngẫu nhiên (cố định trong ngày) từ các bài đã tập */
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function seeded(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
/* lịch ôn cách quãng: mỗi chữ có bậc 0..4 → ôn lại sau 1, 3, 7, 14, 30 ngày */

function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function itemsOf(l){const out=[];for(const r of l.rows||[]){if(r[0]==="rep")out.push(r[1]);else if(r[0]==="stroke")out.push("~"+r[1])}return out}
function schedule(l){for(const it of itemsOf(l))if(!SR[it])SR[it]={lv:0,due:addDays(1)};store.set("sr",SR)}
function dueItems(){const td=today();return Object.entries(SR).filter(([,v])=>v.due<=td).sort((a,b)=>a[1].due<b[1].due?-1:1).map(([k])=>k)}
function itemRow(it){return it[0]==="~"?["stroke",it.slice(1)]:["rep",it]}
let frozenReview=null,frozenLuyen=null;
function buildReview(force=false){

    for(const l of LESSONS.slice(0,NREAL)){if(!done.has(l.id)||!l.rows||l.f)continue;for(const r of l.rows)if(r[0]==="rep"&&[...r[1]].length===1)pool.add(r[1])}
    let more=[...pool].filter(c=>!arr.includes(c));if(!more.length&&!arr.length)more=[..."aoeiu"];
    const rnd=seeded(today());more.sort(()=>rnd()-.5);arr=arr.concat(more.slice(0,8-arr.length))}
  const interleave=SCRIPT==="td"?[["pair","a d g q  a d g q"],["pair","n m u v  l b h k"]]:[["pair","o c e a d q g p b"],["pair","i l t f j  n m u v"]];REVIEW.rows=arr.map(itemRow).concat(interleave,[["pair","abcdefghijklm"],["pair","nopqrstuvwxyz"]]);
  frozenReview=REVIEW.rows.slice();
}

function lessonRows(l){

function repGap(fs){return Math.max(fs*.25,16)}
/* Thang luyện: Tô = tô rõ → tô mờ → chỉ còn chấm đặt bút → chữ trong từ; Nhớ = tên chữ + dòng trống */
function groupsFor(r,m,avail,mode){
  const G=[],fit=s=>2*mw(s,m.fs,m.fam)+repGap(m.fs)<=avail,one=typeof r[1]==="string"&&[...r[1]].length===1;
  if(r[0]==="blank"){for(let i=0;i<r[1];i++)G.push([{k:"blank"}]);return G}
  if(mode==="nho"){
    if(r[0]==="stroke"){G.push([{k:"hint",s:STROKE_NAME[r[1]]||r[1],src:{k:"stroke",s:r[1]},item:"~"+r[1]},{k:"nblank",src:{k:"stroke",s:r[1]}}]);return G}
    if(r[0]==="rep"&&fit(r[1])){const src={k:"rep",s:r[1]};
      G.push([{k:"hint",s:r[1],src,item:r[1]},{k:"nblank",src}].concat(one?[{k:"nblank",src}]:[]));
      if(one)for(const w of WORDS[r[1]]||[])G.push([{k:"hint",s:w,src:{k:"rep",s:w}}]);return G}
    for(const ln of wrap(r[1],avail,m.fs,m.fam))G.push([{k:"hint",s:ln,src:{k:"model",s:ln},item:r[0]==="rep"?r[1]:null},{k:"nblank",src:{k:"model",s:ln}}]);return G}
  if(r[0]==="stroke"){G.push([{k:"stroke",s:r[1],model:1,lv:1,tag:"tô rõ"},{k:"stroke",s:r[1],lv:1}]);
    G.push([{k:"stroke",s:r[1],lv:2,tag:"tô mờ"},{k:"sdots",s:r[1],tag:"gợi ý"}]);return G}
  if(r[0]==="rep"&&fit(r[1])){
    G.push([{k:"rep",s:r[1],model:1,lv:1,tag:"tô rõ"},{k:"rep",s:r[1],lv:1}]);
    G.push([{k:"rep",s:r[1],lv:2,tag:"tô mờ"},{k:"rep",s:r[1],lv:3}]);
    G.push([{k:"dots",s:r[1],tag:"gợi ý"}].concat(one?[{k:"dots",s:r[1]}]:[{k:"blank"}]));
    if(one)for(const w of WORDS[r[1]]||[])G.push([{k:"rep",s:w,model:1,lv:1,tag:"trong từ"},{k:"blank"}]);return G}
  const g=[];for(const ln of wrap(r[1],avail,m.fs,m.fam))g.push({k:"model",s:ln},{k:"trace",s:ln},{k:"trace",s:ln,lv:2});g.push({k:"blank"});G.push(g);return G
}
/* Phân trang thuần: không đổi biến toàn cục. Mỗi dòng nội dung có mã rid cố định (dòng gốc.nhóm.dòng),
   nên nét viết được neo theo dòng chứ không theo số trang — đổi cỡ, bật hộp phóng to hay chế độ tập trung không làm "mất" nét. */
function computePages(l,mode,scale,Hh,ppOverride,v3){
  const so=S.scale;S.scale=scale;const m=sizeFor(l);S.scale=so;const F=m.F;
  let padL,padR,padT,padB,unit,safeSide;
  const up=Math.max(l.up||F.asc+.25,F.asc+.05),dn=Math.max(l.dn||F.desc+.1,F.desc+.03);
  if(v3){safeSide=14;padL=14+(l.f?0:m.xh*.35);padR=10;padT=8;padB=4;unit=(up+dn)*m.fs+m.xh*(SCRIPT==="qs"?.6:.35)}
  else{safeSide=W<520?24:18;padL=safeSide+(l.f?0:m.xh*.35);padR=safeSide;padT=Hh<420?50:56;padB=Hh<420?8:20;unit=(up+dn)*m.fs+m.xh*(SCRIPT==="qs"?.68:.44)}
  const perPage=ppOverride||Math.max(1,Math.floor((Hh-padT-padB)/unit));
  const avail=Math.max(80,W-padL-padR-6);
  const lay={m,padL,padR,padT,unit,perPage,up,safeSide};
  const groups=[];
  const hideM=l.id==="review";
  lessonRows(l).forEach((r,i)=>groupsFor(r,m,avail,mode).forEach((g,j)=>{g.forEach((row,k)=>{row.rid=i+"."+j+"."+k;if(hideM&&row.k==="hint")row.hide=1});groups.push(g)}));
  const pgs=[];let pg=[];
  for(const g of groups){
    if(g.length>perPage){if(pg.length){pgs.push(pg);pg=[]}for(let i=0;i<g.length;i+=perPage)pgs.push(g.slice(i,i+perPage));continue}
    if(pg.length+g.length>perPage&&pg.length){pgs.push(pg);pg=[]}
    pg.push(...g);
  }
  if(pg.length)pgs.push(pg);
  if(!pgs.length)pgs.push([]);
  for(const pgx of pgs){let lr="top";for(const r of pgx)if(r.rid)lr=r.rid;let n=0;while(pgx.length<perPage)pgx.push({k:"blank",rid:"pad:"+lr+":"+(++n)})}
  return {lay,pages:pgs};
}
function buildPages(){
  const r=computePages(LESSONS[cur.li],cur.mode,S.scale,H,0,false);
  layout=r.lay;pages=r.pages;
  if(cur.page>=pages.length)cur.page=pages.length-1;
}

/* ================== VẼ NỀN (DỊU MẮT & DẢI THÂN CHỮ) ================== */
function guides(ctx,b,m,x0,x1){
  const gx0=x0!=null?x0:(layout?Math.max(12,layout.safeSide-6):16);
  const gx1=x1!=null?x1:(W-(layout?Math.max(12,layout.safeSide-6):16));
  if(S.xBand&&T.xBand){ctx.fillStyle=T.xBand;ctx.fillRect(gx0,b-m.xh,gx1-gx0,m.xh)}
  if(S.gridStyle==="oly4"){
    /* Hệ 4 ô ly chuẩn vở tiểu học Việt Nam (1 ly = xh / 2) */
    const ly=m.xh/2,topY=b-Math.max(m.asc,ly*5),botY=b+Math.max(m.desc,ly*3);
    ctx.strokeStyle=T.slant;ctx.lineWidth=0.85;ctx.setLineDash([]);
    ctx.beginPath();
    for(let x=gx0;x<=gx1;x+=ly){ctx.moveTo(x,topY);ctx.lineTo(x,botY)}
    for(let k=-3;k<=5;k++){if(k===0||k===2)continue;const y=b-k*ly;if(y>=topY-1&&y<=botY+1){ctx.moveTo(gx0,y);ctx.lineTo(gx1,y)}}
    ctx.stroke();
    ctx.strokeStyle=T.asc;ctx.lineWidth=1.05;ctx.beginPath();
    for(let x=gx0;x<=gx1;x+=ly*4){ctx.moveTo(x,topY);ctx.lineTo(x,botY)}
    ctx.stroke();
    ctx.strokeStyle=T.slant;ctx.lineWidth=0.8;ctx.setLineDash([3,5]);ctx.beginPath();
    for(let x=gx0+ly*2;x+m.asc*m.tan<gx1;x+=ly*4){ctx.moveTo(x-m.desc*m.tan,b+m.desc);ctx.lineTo(x+m.asc*m.tan,b-m.asc)}
    ctx.stroke();ctx.setLineDash([]);
  }else{
    ctx.lineWidth=1;ctx.strokeStyle=T.slant;ctx.setLineDash([]);
    const step=Math.max(32,m.xh*1.7);
    ctx.beginPath();
    for(let x=gx0+(layout?layout.padL-gx0:14);x+m.asc*m.tan<gx1;x+=step){ctx.moveTo(x-m.desc*m.tan,b+m.desc);ctx.lineTo(x+m.asc*m.tan,b-m.asc)}
    ctx.stroke();
  }
  ctx.strokeStyle=T.asc;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(gx0,b-m.asc);ctx.lineTo(gx1,b-m.asc);ctx.stroke();
  ctx.strokeStyle=T.xh;ctx.lineWidth=1.15;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(gx0,b-m.xh);ctx.lineTo(gx1,b-m.xh);ctx.stroke();

      r.onsuccess=()=>{for(const k of r.result){const s=String(k);if(s.startsWith(PFX+pre))keys.add(s.slice(PFX.length))}res()};r.onerror=()=>res()}catch(_){res()}});
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PFX+pre))keys.add(k.slice(PFX.length))}
    const out=[];
    for(const k of keys){
      const mm=k.slice(pre.length).match(/^(\d+):([LP]):([\d.]+)(?::p(\d+))?$/);if(!mm||mm[2]!==o)continue;

    for(const ev of evs)eraseAt(pos(ev));return}

function segDist2(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;let u=L2?((px-a[0])*dx+(py-a[1])*dy)/L2:0;u=Math.max(0,Math.min(1,u));
  const x=a[0]+dx*u-px,y=a[1]+dy*u-py;return x*x+y*y}
function strokeHit(s,q,r2){const p=s.p;if(p.length===1){const dx=p[0][0]-q[0],dy=p[0][1]-q[1];return dx*dx+dy*dy<r2}
  for(let i=1;i<p.length;i++)if(segDist2(q[0],q[1],p[i-1],p[i])<r2)return true;return false}
function densify(p,step){const out=[p[0]];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);
  if(d>step){const n=Math.ceil(d/step);for(let k=1;k<n;k++){const t=k/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,(a[2]||.5)+((b[2]||.5)-(a[2]||.5))*t,(a[3]||0)+((b[3]||0)-(a[3]||0))*t])}}
  out.push(b)}return out}
function eraseAt(q,z=view.z){
  const r=(S.eraserR||16)/Math.max(1,z||1),r2=r*r;
  let changed=false;
  if(S.eraseMode==="stroke"){
    const next=strokes.filter(s=>{const hit=strokeHit(s,q,r2);if(hit)changed=true;return !hit});
    if(changed){strokes=next;if(live)live.changed=true;renderInk()}
    return;
  }
  /* Tẩy từng đoạn: chèn thêm điểm dọc nét rồi cắt, nên tẩy được cả khúc giữa nét thẳng */
  const next=[];
  for(const s of strokes){
    if(!strokeHit(s,q,r2)){next.push(s);continue}
    changed=true;
    const pts=densify(s.p,Math.max(1,r*.35));let seg=[];
    for(const p of pts){const dx=p[0]-q[0],dy=p[1]-q[1];
      if(dx*dx+dy*dy<r2){if(seg.length>1)next.push(Object.assign({},s,{p:seg}));seg=[]}else seg.push(p)}
    if(seg.length>1)next.push(Object.assign({},s,{p:seg}));
  }
  if(changed){strokes=next;if(live)live.changed=true;renderInk()}
}

/* ================== ÂM THANH GIẤY TỔNG HỢP (WEB AUDIO API) ================== */
let audioCtx=null,noiseGain=null,noiseFilter=null;
function ensureAudio(){
  if(!S.sound)return false;
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      audioCtx=new AC();
      const buf=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate),ch=buf.getChannelData(0);
      for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*0.55;
      const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
      noiseFilter=audioCtx.createBiquadFilter();noiseFilter.type="bandpass";noiseFilter.frequency.value=2200;noiseFilter.Q.value=1.8;
      noiseGain=audioCtx.createGain();noiseGain.gain.value=0;
      src.connect(noiseFilter);noiseFilter.connect(noiseGain);noiseGain.connect(audioCtx.destination);
      src.start();
    }
    if(audioCtx.state==="suspended")audioCtx.resume();
    return true;
  }catch(_){return false}
}
function paperSoundStep(a,b){
  if(!S.sound||!ensureAudio())return;
  const spd=Math.min(18,Math.hypot(b[0]-a[0],b[1]-a[1]));
  const pr=b[2]||.5;
  const vol=Math.min(0.065,(spd/18)*0.045*(0.45+0.9*pr));
  const freq=S.penType==="pencil"?1800+spd*90:S.penType==="brush"?1100+spd*40:2500+spd*110;
  try{
    noiseFilter.frequency.setTargetAtTime(freq,audioCtx.currentTime,0.02);
    noiseGain.gain.setTargetAtTime(vol,audioCtx.currentTime,0.015);
  }catch(_){}
}
function paperSoundStop(){
  if(noiseGain&&audioCtx){try{noiseGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.03)}catch(_){}}
}

/* ================== ĐO NÉT VIẾT (công thức hình học, không dùng AI) ================== */
let lastMetrics=null;
function resamplePts(pts,N=24){
  if(!pts||pts.length<2)return [];
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=cum[cum.length-1]||1,out=[];
  for(let k=0;k<N;k++){
    const d=(k/(N-1))*tot;let j=1;while(j<cum.length-1&&cum[j]<d)j++;
    const seg=cum[j]-cum[j-1]||1,t=(d-cum[j-1])/seg;
    out.push([pts[j-1][0]+(pts[j][0]-pts[j-1][0])*t,pts[j-1][1]+(pts[j][1]-pts[j-1][1])*t]);
  }
  return out;
}
/* So hình chữ bằng khoảng cách hai chiều giữa hai tập điểm (không phụ thuộc thứ tự hay chiều nét) */
const SHAPE_K=180;
function shapeSet(list,N=48){
  const L=list.filter(p=>p&&p.length).map(p=>{let l=0;for(let i=1;i<p.length;i++)l+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return [p,l]});
  const tot=L.reduce((a,x)=>a+x[1],0);if(!L.length)return null;
  let pts=[];for(const [p,l] of L){if(p.length===1||l<1e-6){pts.push(p[0]);continue}pts=pts.concat(resamplePts(p,Math.max(2,Math.round(N*l/(tot||1)))))}
  if(pts.length<4)return null;
  const cx=pts.reduce((a,q)=>a+q[0],0)/pts.length,cy=pts.reduce((a,q)=>a+q[1],0)/pts.length;
  const sc=Math.sqrt(pts.reduce((a,q)=>a+(q[0]-cx)**2+(q[1]-cy)**2,0)/pts.length)||1;
  return pts.map(q=>[(q[0]-cx)/sc,(q[1]-cy)/sc]);
}
function chamfer(A,B){
  const one=(P,Q)=>{let t=0;for(const p of P){let mn=1e9;for(const q of Q){const d=(p[0]-q[0])**2+(p[1]-q[1])**2;if(d<mn)mn=d}t+=Math.sqrt(mn)}return t/P.length};
  return (one(A,B)+one(B,A))/2;
}
function scoreGeometry(){
  if(!layout||!pages[cur.page])return null;
  const {m,padT,unit,up,padL}=layout,rows=pages[cur.page];
  let matched=0,scoreSum=0,baseErrSum=0,baseCnt=0;
  const validStrokes=strokes.filter(s=>strokeType(s)!=="marker"&&s.p.length>=3);
  if(!validStrokes.length)return null;
  rows.forEach((row,ri)=>{
    const b=padT+ri*unit+up*m.fs;
    const rs=validStrokes.filter(s=>{
      const ys=s.p.map(q=>q[1]),midY=(Math.min(...ys)+Math.max(...ys))/2;
      return Math.abs(midY-(b-m.xh*0.5))<unit*0.48;
    });
    if(!rs.length)return;
    for(const s of rs){
      const maxY=Math.max(...s.p.map(q=>q[1]));
      if(maxY>b-m.xh*0.35&&maxY<b+m.desc*0.45){baseErrSum+=Math.abs(maxY-b)/m.xh;baseCnt++}
    }
    const sym=row.k==="stroke"||row.k==="sdots"?"~"+row.s:(row.src&&row.src.k==="stroke"?"~"+row.src.s:(row.s&&[...row.s].length===1?row.s:(row.src&&row.src.s&&[...row.src.s].length===1?row.src.s:null)));
    if(!sym||!DUCTUS[sym])return;
    const refSet=shapeSet(DUCTUS[sym].flatMap(st=>st.r.map(r=>aCatmull(r,8))));
    if(!refSet)return;
    /* gom nét thành từng chữ theo vùng ngang (chỉ để tách chữ, không dùng thứ tự nét khi so) */
    const sorted=rs.slice().sort((a,b)=>Math.min(...a.p.map(q=>q[0]))-Math.min(...b.p.map(q=>q[0])));
    const clusters=[];
    for(const s of sorted){
      const xMin=Math.min(...s.p.map(q=>q[0])),xMax=Math.max(...s.p.map(q=>q[0]));
      const last=clusters[clusters.length-1];
      if(last&&xMin<=last.xMax+m.xh*0.45){last.list.push(s.p);last.xMax=Math.max(last.xMax,xMax)}
      else clusters.push({list:[s.p],xMin,xMax});
    }
    for(const cl of clusters){
      if(cl.list.reduce((a,p)=>a+p.length,0)<5)continue;
      const uSet=shapeSet(cl.list.map(p=>p.map(q=>[(q[0]-padL)/m.xh,(b-q[1])/m.xh])));
      if(!uSet)continue;
      const s0=Math.max(30,Math.min(100,Math.round(100-Math.max(0,chamfer(uSet,refSet)-.04)*SHAPE_K)));
      scoreSum+=s0;matched++;
    }
  });
  return {
    shapeScore:matched?Math.round(scoreSum/matched):null,
    matchedCount:matched,
    baseDrift:baseCnt?Math.round((baseErrSum/baseCnt)*100):null
  };
}
function measure(){
  const el=document.getElementById("meas"),l=LESSONS[cur.li];
  if(!S.measure||!layout||l.f==="AL"){el.classList.remove("on");lastMetrics=null;return}
  const xh=layout.m.xh,target=90-fontOf(l).slant;
  let dW=0,dN=0,uW=0,uN=0,pSum=0,pCnt=0,jerkSum=0,jerkCnt=0;
  const angles=[];
  for(const s of strokes){
    if(strokeType(s)==="marker")continue;
    const p=s.p;let run=[];
    for(let i=0;i<p.length;i++){pSum+=p[i][2]||.5;pCnt++}
    for(let i=2;i<p.length;i++){
      const d1x=p[i-1][0]-p[i-2][0],d1y=p[i-1][1]-p[i-2][1],d2x=p[i][0]-p[i-1][0],d2y=p[i][1]-p[i-1][1];
      const l1=Math.hypot(d1x,d1y),l2=Math.hypot(d2x,d2y);
      if(l1>0.8&&l2>0.8){const cos=Math.max(-1,Math.min(1,(d1x*d2x+d1y*d2y)/(l1*l2)));jerkSum+=(1-cos);jerkCnt++}
    }
    const flush=()=>{if(run.length>2){const a=run[0],b=run[run.length-1],L=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(L>xh*.55&&b[1]>a[1]){const ang=Math.atan2(b[1]-a[1],a[0]-b[0])*180/Math.PI;if(ang>20&&ang<160)angles.push([ang,L])}}run=[]};
    for(let i=1;i<p.length;i++){const down=p[i][1]-p[i-1][1]>0.2;
      if(s.pr){const w=segW(s,(p[i][2]+p[i-1][2])/2);if(down){dW+=w;dN++}else if(p[i][1]-p[i-1][1]<-0.2){uW+=w;uN++}}
      if(down){if(!run.length)run.push(p[i-1]);run.push(p[i])}else flush()}
    flush();
  }
  const wSum=angles.reduce((a,x)=>a+x[1],0);
  if(wSum<xh*1.8){el.classList.remove("on");lastMetrics=null;return}
  const mean=angles.reduce((a,x)=>a+x[0]*x[1],0)/wSum;
  const variance=angles.reduce((a,x)=>a+x[1]*(x[0]-mean)**2,0)/wSum;
  const sd=Math.sqrt(variance);
  const ang=Math.round(mean),ratio=uN&&dN?(dW/dN)/(uW/uN):0,diff=ang-target;
  const avgP=pCnt?pSum/pCnt:0.5;
  const fluency=jerkCnt?Math.max(40,Math.min(100,Math.round(100-(jerkSum/jerkCnt)*180))):85;
  const geo=scoreGeometry();
  const slantScore=Math.max(20,Math.min(100,Math.round(100-Math.abs(diff)*3.2-sd*2.6)));
  const totalScore=geo&&geo.shapeScore?Math.round(geo.shapeScore*0.45+slantScore*0.35+fluency*0.2):Math.round(slantScore*0.65+fluency*0.35);
  lastMetrics={ang,target:Math.round(target),diff,sd:Math.round(sd*10)/10,ratio,avgP,fluency,geo,slantScore,totalScore};
  const sdTxt=`±${lastMetrics.sd}°`;
  el.innerHTML=`${ic("chart")}<b>${totalScore}đ</b> · Nghiêng ${ang}° (${sdTxt})${Math.abs(diff)<=5&&sd<=6?" ✓":diff>5?" · đứng":diff<-5?" · ngả":" · chưa đều"}`+(ratio?` · ${ratio.toFixed(1).replace(".",",")}×`:"");
  el.classList.add("on");
}
function openScoreReport(){
  if(!lastMetrics){toast("Hãy viết vài chữ để ứng dụng phân tích");return}
  const m=lastMetrics,box=document.getElementById("genBox");

  if(Math.abs(m.diff)>5)tips.push(m.diff>0?`Độ nghiêng trung bình đang đứng hơn mẫu (${m.ang}° so với ${m.target}°) — thử xoay nhẹ máy sang trái.`:`Nét đang ngả sâu hơn mẫu (${m.ang}° so với ${m.target}°).`);

  if(m.avgP>0.72)tips.push(`Lực nhấn trung bình cao (${Math.round(m.avgP*100)}%) — có thể gây mỏi cổ tay nếu viết lâu. Thử thả lỏng ngón trỏ.`);
  if(m.fluency<72)tips.push(`Nét viết hơi khựng (${m.fluency}/100) — hãy đưa tay trơn hơn thay vì “vẽ” chậm từng đoạn ngắn.`);
  if(m.geo&&m.geo.baseDrift!=null&&m.geo.baseDrift>18)tips.push(`Chân chữ lệch đường cơ sở trung bình ${m.geo.baseDrift}% thân chữ — chú ý chạm đúng đường chân đậm.`);
  if(!tips.length)tips.push("Nhịp tay rất đều, góc nghiêng bám sát chuẩn và lực tì bút thoải mái. Duy trì tốc độ này!");

    <div class="scCard"><b>${m.ang}° <small style="font-size:14px">±${m.sd}°</small></b><span>Độ nghiêng (mẫu ${m.target}°)</span></div>
    <div class="scCard"><b>${m.geo&&m.geo.shapeScore?m.geo.shapeScore+"/100":"—"}</b><span>Khớp đường nét mẫu</span></div>
    <div class="scCard"><b>${m.fluency}/100</b><span>Độ mượt vận động</span></div>
  </div>
  <div class="kv">
    <b>Độ đều góc nghiêng</b>${m.sd<=5?"Rất đều ✓":m.sd<=8?"Khá đều":"Chưa đều (cần bám đường xiên)"}<br>
    <b>Tỉ lệ đậm / mảnh</b>${m.ratio?m.ratio.toFixed(2).replace(".",",")+"×":"(Chế độ nét đều)"}<br>
    <b>Lực nhấn trung bình</b>${Math.round(m.avgP*100)}% ${m.avgP>0.72?"(Hơi gồng tay)":"(Thả lỏng tốt ✓)"}<br>
    <b>Bám đường chân</b>${m.geo&&m.geo.baseDrift!=null?`Sai số ${m.geo.baseDrift}% thân chữ`:"Chưa đủ dữ liệu"}
  </div>
  <h4>Gợi ý điều chỉnh tay viết</h4><ul>${tips.map(t=>`<li>${t}</li>`).join("")}</ul>
  <button class="btn primary" onclick="closeSheets()">Tiếp tục tập</button>`;
  openSheet("gen");

function zboxPos(e){

function clearZBFx(){zbfCtx.setTransform(1,0,0,1,0,0);zbfCtx.clearRect(0,0,zboxFx.width,zboxFx.height)}
zboxCv.addEventListener("pointerdown",e=>{
  clearZBFx();clearTimeout(zbox.advTimer);
  if(exporting)return;
  const isPen=e.pointerType==="pen"||e.pointerType==="mouse"||(!S.penOnly);
  if(!isPen)return;
  e.preventDefault();try{zboxCv.setPointerCapture(e.pointerId)}catch(_){}
  const sideBtn=e.pointerType==="pen"&&(e.button===5||(e.buttons&32)||(e.buttons&2));
  if(sideBtn&&S.sideBtn==="undo"){undo();toast("Hoàn tác");return}
  if(sideBtn&&S.sideBtn==="fav"){cycleFavPen();return}
  const erase=tool==="eraser"||(sideBtn&&S.sideBtn==="eraser");
  if(erase){zbox.live={erase:true,changed:false};snapshot();eraseAt(zboxPos(e),zbox.zoom);return}
  snapshot();
  const q=zboxPos(e);q[2]=Math.min(q[2],.35);
  zbox.live={tp:S.penType,c:S.color,w:S.width,pr:S.pressure,ct:S.contrast,na:S.nibAngle,tl:S.tiltOn,p:[q]};
  const d=Math.min(devicePixelRatio||1,3),{sx,sy}=zboxViewRect();

zboxCv.addEventListener("pointermove",e=>{

  e.preventDefault();
  let evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];
  if(zbox.live.erase){for(const ev of evs)eraseAt(zboxPos(ev),zbox.zoom);return}
  const minStep=0.45/zbox.zoom,stb=Math.min(0.75,Math.max(0,S.stab||0));
  const ztp=strokeType(zbox.live),zinc=ztp!=="marker"&&ztp!=="pencil";
  const zd=Math.min(devicePixelRatio||1,3),zvr=zboxViewRect();
  zbfCtx.setTransform(zd*zbox.zoom,0,0,zd*zbox.zoom,-zvr.sx*zd*zbox.zoom,-zvr.sy*zd*zbox.zoom);

    const raw=zboxPos(ev),p=zbox.live.p[zbox.live.p.length-1];

      Math.round((p[2]*.58+raw[2]*.42)*1000)/1000,
      Math.round(((p[3]||0)*.65+raw[3]*.35)*100)/100

    if(Math.abs(q[0]-p[0])+Math.abs(q[1]-p[1])<minStep)continue;
    zbox.live.p.push(q);paperSoundStep(p,q);

  }
  if(!zinc){clearZBFx();zbfCtx.setTransform(zd*zbox.zoom,0,0,zd*zbox.zoom,-zvr.sx*zd*zbox.zoom,-zvr.sy*zd*zbox.zoom);drawStroke(zbfCtx,zbox.live,true)}
},{passive:false});

  let k=SCALES.reduce((bi,v,i)=>Math.abs(v-S.scale)<Math.abs(SCALES[bi]-S.scale)?i:bi,0);

async function idbDumpStore(name){

    r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res()};r.onerror=res}catch(_){res()}});
  return out;
}

function buildAnimData(ch){

function drawQuizDirArrow(ctx,st,Tp,xh,dark,eink){
  if(st.totalLen<0.23||!st.runs.length)return;
  const run=st.runs[0];
  let a0=0.22;if(run.len<a0+0.15)a0=0;
  const offPts=aOffset(run.pts,st.side||1);
  const seg=aHead(aTrim(offPts,a0,0),Math.min(0.62,Math.max(0.20,run.len*0.48)));
  if(seg.length<2)return;
  const col=eink?"#333333":(dark?ARROW.redDark:ARROW.red);

  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();const s=Tp(seg[0]);ctx.moveTo(s[0],s[1]);
  for(let i=1;i<seg.length;i++){const q=Tp(seg[i]);ctx.lineTo(q[0],q[1])}ctx.stroke();
  const A=Tp(seg[Math.max(0,seg.length-3)]),B=Tp(seg[seg.length-1]);
  const L=Math.hypot(B[0]-A[0],B[1]-A[1])||1,ux=(B[0]-A[0])/L,uy=(B[1]-A[1])/L;

  ctx.restore();
}

    /* nét người học đang kéo bằng S Pen */
    if(quiz.live&&quiz.live.p.length){
      drawStroke(ctx,quiz.live);
    }
  }
  const info=document.getElementById("animInfo");
  if(info){
    if(quiz.msg){info.textContent=quiz.msg;info.className=quiz.msgKind||""}
    else if(doneAll){info.textContent=`${charLabel(ch)} · Hoàn thành (${total}/${total} nét) ✓`;info.className="ok"}
    else{
      const st=animState.strokes[quiz.idx];
      info.className="";
      info.textContent=st.totalLen<0.23?`Nét ${quiz.idx+1}/${total} · Chấm nhẹ vào chấm xanh số ${quiz.idx+1}`:`Nét ${quiz.idx+1}/${total} · Đặt bút ở chấm xanh số ${quiz.idx+1}, kéo theo mũi tên`;
    }
  }
}
function evalQuizStroke(uPts,st){
  const refRaw=[];for(const run of st.runs)refRaw.push(...run.pts);
  const refLen=aLen(refRaw),uLen=aLen(uPts);
  /* 1. Chấm nhỏ (chấm i, j, dấu nặng): chỉ cần chấm gần vị trí chấm */
  if(refLen<0.23){
    const rcx=refRaw.reduce((a,p)=>a+p[0],0)/refRaw.length,rcy=refRaw.reduce((a,p)=>a+p[1],0)/refRaw.length;
    const ucx=uPts.reduce((a,p)=>a+p[0],0)/uPts.length,ucy=uPts.reduce((a,p)=>a+p[1],0)/uPts.length;
    const dist=Math.hypot(ucx-rcx,ucy-rcy);
    return dist<=0.65&&uLen<=1.0?{ok:true}:{ok:false,why:dist>0.65?"start":"far"};
  }
  const N=28,R=resamplePts(refRaw,N),U=uPts.length<2?Array.from({length:N},()=>uPts[0]):resamplePts(uPts,N);
  const uSmoothLen=aLen(U);
  const startTol=Math.max(0.55,Math.min(0.95,0.45+refLen*0.14));
  const dStart=Math.hypot(uPts[0][0]-refRaw[0][0],uPts[0][1]-refRaw[0][1]);
  const dEndAsStart=Math.hypot(uPts[0][0]-refRaw[refRaw.length-1][0],uPts[0][1]-refRaw[refRaw.length-1][1]);
  let dFwd=0,dRev=0;
  for(let i=0;i<N;i++){
    dFwd+=Math.hypot(U[i][0]-R[i][0],U[i][1]-R[i][1]);
    dRev+=Math.hypot(U[N-1-i][0]-R[i][0],U[N-1-i][1]-R[i][1]);
  }
  dFwd/=N;dRev/=N;
  let dotSum=0,dotCnt=0;
  for(let i=0;i<N-3;i+=2){
    const rx=R[i+3][0]-R[i][0],ry=R[i+3][1]-R[i][1],ux=U[i+3][0]-U[i][0],uy=U[i+3][1]-U[i][1];
    const rl=Math.hypot(rx,ry),ul=Math.hypot(ux,uy);
    if(rl>1e-4&&ul>1e-4){dotSum+=(rx*ux+ry*uy)/(rl*ul);dotCnt++}
  }
  const dirAlign=dotCnt?dotSum/dotCnt:1;
  if(uSmoothLen>=refLen*0.35&&(dRev<dFwd*0.78||dirAlign<0.15))return {ok:false,why:"dir"};
  if(dStart>startTol){
    if(dEndAsStart<startTol&&Math.hypot(refRaw[0][0]-refRaw[refRaw.length-1][0],refRaw[0][1]-refRaw[refRaw.length-1][1])>0.35)return {ok:false,why:"dir"};
    return {ok:false,why:"start"};
  }
  if(uSmoothLen<refLen*0.52)return {ok:false,why:"short"};
  if(uSmoothLen>refLen*2.1+0.7)return {ok:false,why:"far"};
  const pathTol=Math.max(0.45,Math.min(0.82,0.36+refLen*0.11));
  if(dFwd>pathTol)return {ok:false,why:"far"};
  return {ok:true};
}
function startQuizIdleLoop(){
  if(animRAF){cancelAnimationFrame(animRAF);animRAF=0}
  const reduced=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick=ts=>{
    if(animState.mode!=="quiz"||!document.getElementById("card").classList.contains("open")){animRAF=0;return}
    const now=ts||performance.now();
    if(quiz.hint){
      const dt=Math.min(0.05,(now-(quiz.hint.last||now))/1000);quiz.hint.last=now;
      quiz.hint.t+=dt;
      const st=animState.strokes[quiz.idx],dur=Math.max(0.42,st.totalLen/(animState.slow?1.55:2.4));
      if(quiz.hint.t>=dur+0.42){quiz.hint=null}
      else{quiz.hint.frac=Math.min(1,quiz.hint.t/dur)}
      drawQuizFrame(now);
      animRAF=requestAnimationFrame(tick);return;
    }
    const needFail=quiz.failPts&&now<quiz.failUntil;
    const needPulse=!quiz.live&&quiz.idx<animState.strokes.length&&!reduced&&themeName()!=="eink";
    if(needFail||needPulse){
      if(!needFail&&quiz.failPts)quiz.failPts=null;
      drawQuizFrame(now);
      animRAF=requestAnimationFrame(tick);return;
    }
    if(quiz.failPts){quiz.failPts=null;drawQuizFrame(now)}
    animRAF=0;
  };
  animRAF=requestAnimationFrame(tick);
}
function quizShowHint(){
  if(animState.mode!=="quiz"||quiz.idx>=animState.strokes.length)return;
  if(quiz.timer){clearTimeout(quiz.timer);quiz.timer=0}
  quiz.live=null;quiz.failPts=null;quiz.hint={t:0,frac:0,last:performance.now()};

}
function quizReset(){

}

function bindQuizCanvas(){
  const cv=document.getElementById("animCv");if(!cv)return;
  const ptOf=e=>{
    const r=cv.getBoundingClientRect();
    let p=e.pointerType==="pen"?e.pressure:.5;if(!(p>0))p=.5;
    return [Math.round((e.clientX-r.left)*10)/10,Math.round((e.clientY-r.top)*10)/10,Math.round(p*1000)/1000,tiltMagOf(e)];
  };
  cv.onpointerdown=e=>{
    if(animState.mode!=="quiz"||!quiz.geom||quiz.idx>=animState.strokes.length)return;
    if(e.pointerType==="pen"&&!GS.get("penSeen",false))GS.set("penSeen",true);
    const allow=e.pointerType==="pen"||e.pointerType==="mouse"||!S.penOnly||!GS.get("penSeen",false);
    if(!allow){if(e.pointerType==="touch"){quiz.msg="Dùng S Pen để tô · đang bật Chỉ nhận S Pen";quiz.msgKind="err";drawQuizFrame()}return}
    e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(quiz.timer){clearTimeout(quiz.timer);quiz.timer=0}
    quiz.hint=null;quiz.failPts=null;quiz.failUntil=0;
    const q=ptOf(e);q[2]=Math.min(q[2],.38);
    const col=themeName()==="dark"?"#82B4FF":themeName()==="eink"?"#333333":"#184E9E";
    const w=Math.max(2.8,Math.min(6.5,quiz.geom.xh*(SCRIPT==="qs"?0.11:0.085)));
    quiz.live={tp:SCRIPT==="td"?"fountain":"gel",c:col,w,pr:SCRIPT==="td",ct:"med",na:38,tl:false,p:[q]};
    drawQuizFrame();
  };
  cv.onpointermove=e=>{
    if(!quiz.live||animState.mode!=="quiz")return;
    e.preventDefault();
    let evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];
    for(const ev of evs){
      const raw=ptOf(ev),p=quiz.live.p[quiz.live.p.length-1];
      if(Math.hypot(raw[0]-p[0],raw[1]-p[1])<1.2)continue;
      quiz.live.p.push([raw[0],raw[1],Math.round((p[2]*.55+raw[2]*.45)*1000)/1000,raw[3]]);
    }
    drawQuizFrame();
  };
  const endQuiz=e=>{
    if(!quiz.live||animState.mode!=="quiz")return;
    const stObj=quiz.live;quiz.live=null;
    const g=quiz.geom,target=animState.strokes[quiz.idx];
    if(!g||!target){drawQuizFrame();return}
    const uNorm=stObj.p.map(q=>[(q[0]-g.x0)/g.xh,(g.b-q[1])/g.xh]);
    const res=evalQuizStroke(uNorm,target);
    if(res.ok){
      quiz.idx++;quiz.misses=0;quiz.failPts=null;
      const total=animState.strokes.length;
      if(quiz.idx>=total){
        quiz.doneSet.add(animState.ch);updAnimChips();
        quiz.msg=`${charLabel(animState.ch)} · Hoàn thành (${total}/${total} nét) ✓`;quiz.msgKind="ok";
        renderAnimCtrl();
      }else{
        quiz.msg=`Đúng nét ${quiz.idx} ✓ · Tiếp nét ${quiz.idx+1}/${total}`;quiz.msgKind="ok";
      }
      drawQuizFrame();startQuizIdleLoop();
    }else{
      quiz.misses++;
      const n=quiz.idx+1;
      const msgs={
        start:`Đặt bút gần chấm xanh số ${n}`,
        dir:`Nét ${n} kéo ngược chiều — xem lại hướng mũi tên`,
        short:`Nét ${n} hơi ngắn — kéo hết theo bóng chữ`,
        far:`Nét ${n} hơi lệch mẫu — bám theo bóng chữ mờ`
      };
      quiz.msg=msgs[res.why]||msgs.far;quiz.msgKind="err";
      quiz.failPts=stObj.p.slice();quiz.failUntil=performance.now()+380;
      drawQuizFrame();startQuizIdleLoop();
      if(res.why==="dir"||quiz.misses>=2){
        if(quiz.timer)clearTimeout(quiz.timer);
        quiz.timer=setTimeout(()=>{quiz.timer=0;if(animState.mode==="quiz"&&document.getElementById("card").classList.contains("open"))quizShowHint()},340);
      }
    }
  };
  cv.onpointerup=endQuiz;cv.onpointercancel=endQuiz;
}

function demoInit(){const c=document.getElementById("demo");if(!c)return;const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,3);

  c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}
    const pr=e.pointerType==="pen"?(e.pressure||.5):.5;
    s={tp:S.penType,c:S.color,w:S.width,pr:S.pressure,ct:S.contrast,na:S.nibAngle,tl:S.tiltOn,p:[[e.offsetX,e.offsetY,Math.min(.35,pr),tiltMagOf(e)]]};
    demoS.push(s);demo()};
  c.onpointermove=e=>{if(!s)return;const p=s.p[s.p.length-1];let pr=e.pointerType==="pen"?(e.pressure||.5):.5;
    const tm=tiltMagOf(e),stb=S.stab||0;
    const nx=stb>0?(p[0]*stb+e.offsetX*(1-stb)):e.offsetX;
    const ny=stb>0?(p[1]*stb+e.offsetY*(1-stb)):e.offsetY;

  const h=e=>{

      evTimes=evTimes.filter(t=>now-t<500);if(evTimes.length>4)R.hz=Math.round(evTimes.length*2);
