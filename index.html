function dataUrlToBytes(dataUrl){
  const b64=dataUrl.split(",")[1],bin=atob(b64),arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr;
}

/* Bộ đóng gói PDF 1.4 nhị phân chuẩn (hỗ trợ ảnh JPEG gốc + Link Annotations nhảy trang + Bookmarks) */
function assemblePdf(pagesData,ptW,ptH){
  const enc=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&0xFF;return a};
  const chunks=[];let byteLen=0;
  const push=u=>{chunks.push(u);byteLen+=u.length};
  const pushStr=s=>push(enc(s));
  const offsets=[0];
  const startObj=id=>{offsets[id]=byteLen;pushStr(`${id} 0 obj\n`)};
  const endObj=()=>pushStr(`\nendobj\n`);

  pushStr("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const N=pagesData.length;
  /* Bố trí ID đối tượng: 1=Catalog, 2=Pages, mỗi trang i có 3 obj: Page(3+3i), Img(4+3i), Content(5+3i) */
  const pageIds=[],annotObjs=[];
  let nextId=3+N*3;
  for(let i=0;i<N;i++)pageIds.push(3+i*3);

  /* Khai báo trước các Link Annotation cho trang Mục lục (nếu có) */
  const pageAnnotIds=pagesData.map(pg=>{
    const ids=[];
    for(const lk of (pg.links||[])){
      const aid=nextId++;
      ids.push(aid);
      annotObjs.push({id:aid,rect:lk.rect,targetPageId:pageIds[lk.targetPage]});
    }
    return ids;
  });

  startObj(1);pushStr(`<< /Type /Catalog /Pages 2 0 R >>`);endObj();
  startObj(2);pushStr(`<< /Type /Pages /Count ${N} /Kids [${pageIds.map(id=>id+" 0 R").join(" ")}] >>`);endObj();

  for(let i=0;i<N;i++){
    const pg=pagesData[i],pid=3+i*3,imgId=4+i*3,cntId=5+i*3;
    const ann=pageAnnotIds[i].length?` /Annots [${pageAnnotIds[i].map(id=>id+" 0 R").join(" ")}]`:"";
    startObj(pid);
    pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW.toFixed(2)} ${ptH.toFixed(2)}] /Resources << /XObject << /Im0 ${imgId} 0 R >> >> /Contents ${cntId} 0 R${ann} >>`);
    endObj();

    startObj(imgId);
    pushStr(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.jpg.length} >>\nstream\n`);
    push(pg.jpg);
    pushStr(`\nendstream`);
    endObj();

    const stream=`q ${ptW.toFixed(2)} 0 0 ${ptH.toFixed(2)} 0 0 cm /Im0 Do Q`;
    startObj(cntId);
    pushStr(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    endObj();
  }

  for(const a of annotObjs){
    startObj(a.id);
    pushStr(`<< /Type /Annot /Subtype /Link /Rect [${a.rect.map(v=>v.toFixed(1)).join(" ")}] /Border [0 0 0] /Dest [${a.targetPageId} 0 R /Fit] >>`);
    endObj();
  }

  const xrefPos=byteLen;
  const totalObjs=nextId;
  pushStr(`xref\n0 ${totalObjs}\n0000000000 65535 f \n`);
  for(let i=1;i<totalObjs;i++){
    pushStr(String(offsets[i]).padStart(10,"0")+" 00000 n \n");
  }
  pushStr(`trailer\n<< /Size ${totalObjs} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);

  const out=new Uint8Array(byteLen);let off=0;
  for(const c of chunks){out.set(c,off);off+=c.length}
  return new Blob([out],{type:"application/pdf"});
}

async function generateWorkbookPdf(){
  if(pdfOpt.busy)return;
  pdfOpt.busy=true;flushSave();exporting=true;
  const btn=document.getElementById("pdfGoBtn"),prog=document.getElementById("pdfProg");
  if(btn)btn.disabled=true;
  if(prog){prog.style.display="block";prog.textContent="Đang chuẩn bị bố cục trang…"}

  /* Lưu trạng thái toàn cục để khôi phục nguyên vẹn sau khi render offscreen */
  const saveW=W,saveH=H,saveLayout=layout,saveT=T,saveSGrid=S.gridStyle,saveSArrows=S.rowArrows,saveSXBand=S.xBand,saveScale=S.scale,saveSTrace=S.trace;
  try{
    const pr=PDF_PRESETS[pdfOpt.preset];
    let targetLessons=[];
    if(pdfOpt.scope==="cur"){targetLessons=[LESSONS[cur.li]]}
    else if(pdfOpt.scope==="part"){
      const curPart=LESSONS[cur.li].part;

    }else if(pdfOpt.scope==="weak"){
      if(WEAK.length){buildLuyen(true);targetLessons=[LUYEN]}
      else{buildReview(true);targetLessons=[REVIEW]}
    }else{
      targetLessons=[LESSONS.find(l=>l.id==="free")||LESSONS[cur.li]];
    }

    const cv=document.createElement("canvas");cv.width=pr.pxW;cv.height=pr.pxH;
    const ctx=cv.getContext("2d");
    const pdfTheme=pr.mono?THEMES.eink:THEMES.light;

    /* Tạm gán thông số trang in */
    W=pr.pxW;H=pr.pxH;T=pdfTheme;
    S.gridStyle=pdfOpt.grid;S.rowArrows=pdfOpt.arrows;S.xBand=!pr.mono;S.trace="dark";
    S.scale=pr.pxW>=1500?2.15:1.85;

    const padL=pdfOpt.barSide==="left"?pr.bar:68;
    const padR=pdfOpt.barSide==="right"?pr.bar:68;
    const padT=138,padB=86;

    /* Tạo trước danh sách trang cho từng bài học */
    const lessonJobs=[];
    let totalContentPages=0;
    for(const l of targetLessons){
      const m=sizeFor(l),F=m.F;
      const up=Math.max(l.up||F.asc+.25,F.asc+.05),dn=Math.max(l.dn||F.desc+.1,F.desc+.03);
      const unit=(up+dn)*m.fs+m.xh*(SCRIPT==="qs"?.72:.48);
      const perPage=Math.max(1,Math.floor((H-padT-padB)/unit));
      const avail=Math.max(200,W-padL-padR-12);
      const rLayout={m,padL,padR,padT,unit,perPage,up,safeSide:Math.min(padL,padR)};
      layout=rLayout;
      const lMode=l.id==="review"?"nho":pdfOpt.mode;
      const groups=[];for(const r of lessonRows(l))groups.push(...groupsFor(r,m,avail,lMode));
      if(l.id==="review")groups.forEach(g=>g.forEach(row=>{if(row.k==="hint")row.hide=1}));
      const lPages=[];let pg=[];
      for(const g of groups){
        if(g.length>perPage){if(pg.length){lPages.push(pg);pg=[]}for(let k=0;k<g.length;k+=perPage)lPages.push(g.slice(k,k+perPage));continue}
        if(pg.length+g.length>perPage&&pg.length){lPages.push(pg);pg=[]}
        pg.push(...g);
      }
      if(pg.length)lPages.push(pg);
      if(!lPages.length)lPages.push([]);
      for(const pgx of lPages)while(pgx.length<perPage)pgx.push({k:"blank"});
      lessonJobs.push({lesson:l,layout:rLayout,pages:lPages,startPageIdx:0});
      totalContentPages+=lPages.length;
    }

    const needToc=lessonJobs.length>1;
    const tocOffset=needToc?1:0;
    let runningIdx=tocOffset;
    for(const job of lessonJobs){job.startPageIdx=runningIdx;runningIdx+=job.pages.length}

    const pdfPages=[];
    /* Trang 1: Mục lục có link bấm nhảy trang (cho reMarkable & Tablet) */
    if(needToc){
      if(prog)prog.textContent="Đang vẽ trang mục lục…";
      await new Promise(r=>setTimeout(r,10));
      ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#000000";ctx.textBaseline="alphabetic";ctx.textAlign="left";
      ctx.font="700 46px 'QS',sans-serif";
      ctx.fillText(`VỞ LUYỆN CHỮ · ${SC.name.toUpperCase()}`,padL,130);
      ctx.font="500 28px 'QS',sans-serif";ctx.fillStyle="#444444";
      ctx.fillText(`${lessonJobs[0].lesson.part}  ·  ${pr.name}  ·  Chạm vào bài để chuyển tới trang đó`,padL,176);
      ctx.strokeStyle="#000000";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(padL,202);ctx.lineTo(W-padR,202);ctx.stroke();

      const links=[];
      const rowH=Math.min(82,Math.floor((H-300)/Math.max(1,lessonJobs.length)));
      lessonJobs.forEach((job,idx)=>{
        const yTop=230+idx*rowH,yBase=yTop+rowH*0.66;
        ctx.fillStyle=idx%2===0?"#F7F7F7":"#FFFFFF";
        ctx.fillRect(padL,yTop,W-padL-padR,rowH-8);
        ctx.strokeStyle="#CCCCCC";ctx.lineWidth=1.5;ctx.strokeRect(padL,yTop,W-padL-padR,rowH-8);
        ctx.fillStyle="#000000";ctx.font="700 28px 'QS',sans-serif";ctx.textAlign="left";
        ctx.fillText(`${idx+1}. ${job.lesson.t}`,padL+24,yBase);
        ctx.fillStyle="#444444";ctx.font="600 24px 'QS',sans-serif";ctx.textAlign="right";
        ctx.fillText(`Trang ${job.startPageIdx+1}  →`,W-padR-24,yBase);
        /* Chuyển tọa độ sang PDF (gốc dưới trái) cho Annotation Link */
        const x1=(padL/W)*pr.ptW,x2=((W-padR)/W)*pr.ptW;
        const y2=pr.ptH-(yTop/H)*pr.ptH,y1=pr.ptH-((yTop+rowH-8)/H)*pr.ptH;
        links.push({rect:[x1,y1,x2,y2],targetPage:job.startPageIdx});
      });
      ctx.textAlign="center";ctx.fillStyle="#666666";ctx.font="500 22px 'QS',sans-serif";
      ctx.fillText(`Làm bằng ứng dụng Tập viết S Pen, bản ${APP_VER} · ${today()}`,W/2,H-42);
      ctx.textAlign="left";
      pdfPages.push({w:W,h:H,jpg:dataUrlToBytes(cv.toDataURL("image/jpeg",0.9)),links});
    }

    let donePages=0;
    for(const job of lessonJobs){
      layout=job.layout;
      const {m,unit,up}=layout;
      for(let pi=0;pi<job.pages.length;pi++){
        donePages++;
        if(prog)prog.textContent=`Đang vẽ trang ${donePages}/${totalContentPages} (${job.lesson.t})…`;
        await new Promise(r=>setTimeout(r,8));
        ctx.setTransform(1,0,0,1,0,0);
        ctx.fillStyle=T.paper;ctx.fillRect(0,0,W,H);
        /* Tiêu đề trang vở */
        ctx.fillStyle="#000000";ctx.textBaseline="alphabetic";ctx.textAlign="left";
        ctx.font="700 32px 'QS',sans-serif";
        const liIdx=LESSONS.indexOf(job.lesson);
        const hTitle=liIdx>=0&&liIdx<NREAL?`Bài ${liIdx+1} · ${job.lesson.t}`:job.lesson.t;
        ctx.fillText(hTitle,padL,66);
        ctx.font="500 22px 'QS',sans-serif";ctx.fillStyle="#444444";
        ctx.fillText(`${SC.name} · ${job.lesson.id==="review"?"Viết theo trí nhớ":pdfOpt.mode==="to"?"Tô mờ dần":"Chép theo mẫu"} · ${pdfOpt.grid==="oly4"?"4 ô ly Việt Nam":"Lưới xiên Pháp"}`,padL,100);
        ctx.textAlign="right";
        ctx.fillText(`Trang ${donePages+tocOffset}/${totalContentPages+tocOffset}${needToc?"  ·  ↑ Mục lục":""}`,W-padR,66);
        ctx.textAlign="left";
        ctx.strokeStyle="#CCCCCC";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(padL,116);ctx.lineTo(W-padR,116);ctx.stroke();

        /* Vẽ dòng kẻ + chữ mẫu / tô / dấu chấm */
        const rows=job.pages[pi];
        rows.forEach((row,ri)=>{
          const b=padT+ri*unit+up*m.fs;
          guides(ctx,b,m,padL-10,W-padR+10);
          drawRow(ctx,row,b,m,job.lesson.id==="review"?"nho":pdfOpt.mode);
        });
        if(job.lesson.cornell){ /* khung 3 ô: câu hỏi | ghi chép, tóm tắt ở dưới */
          const xL=padL+(W-padL-padR)*.28,yT=padT-6,yS=padT+Math.floor(rows.length*.72)*unit,yB=padT+rows.length*unit;
          ctx.strokeStyle="#555555";ctx.lineWidth=2.4;ctx.beginPath();
          ctx.moveTo(xL,yT);ctx.lineTo(xL,yS);ctx.moveTo(padL-10,yS);ctx.lineTo(W-padR+10,yS);ctx.stroke();
          ctx.fillStyle="#666666";ctx.font="600 20px 'QS',sans-serif";ctx.textAlign="left";
          ctx.fillText("Câu hỏi",padL,yT-6);ctx.fillText("Ghi chép",xL+12,yT-6);ctx.fillText("Tóm tắt",padL,yS+26);
          ctx.strokeStyle="#BBBBBB";ctx.lineWidth=1.5;ctx.strokeRect(padL-10,yT,W-padL-padR+20,yB-yT);
        }
        /* Ghi chú chân trang */
        if(job.lesson.note){
          ctx.fillStyle="#555555";ctx.font="500 20px 'QS',sans-serif";ctx.textAlign="left";
          ctx.fillText("Gợi ý: "+job.lesson.note,padL,H-36);
        }
        /* Nút bấm góc trên phải để quay về Trang 1 Mục lục trên reMarkable */
        const backLinks=needToc?[{rect:[((W-padR-220)/W)*pr.ptW,pr.ptH-(95/H)*pr.ptH,((W-padR)/W)*pr.ptW,pr.ptH-(25/H)*pr.ptH],targetPage:0}]:[];
        pdfPages.push({w:W,h:H,jpg:dataUrlToBytes(cv.toDataURL("image/jpeg",0.9)),links:backLinks});
      }
    }

    if(prog)prog.textContent="Đang tạo tệp PDF…";
    await new Promise(r=>setTimeout(r,10));
    const blob=assemblePdf(pdfPages,pr.ptW,pr.ptH);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`Vo-luyen-chu-${SCRIPT}-${pdfOpt.preset}-${pdfOpt.scope}-${today()}.pdf`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),6000);
    toast(`Đã xuất xong vở PDF (${pdfPages.length} trang) chuẩn ${pr.name}!`);
    closeSheets();
  }catch(err){
    console.error(err);
    toast("Có lỗi khi xuất PDF: "+(err&&err.message?err.message:err));
  }finally{
    W=saveW;H=saveH;layout=saveLayout;T=saveT;S.gridStyle=saveSGrid;S.rowArrows=saveSArrows;S.xBand=saveSXBand;S.scale=saveScale;S.trace=saveSTrace;
    pdfOpt.busy=false;exporting=false;
    if(btn)btn.disabled=false;
    pendingResize=false;resize();
  }
}

function savePng(){const a=document.createElement("a");a.download=`tap-viet-${SCRIPT}-${LESSONS[cur.li].id}-trang${cur.page+1}.png`;a.href=renderFullExport().toDataURL("image/png");a.click()}
function applyTheme(){
  const tn=themeName();
  T=THEMES[tn];
  document.body.classList.remove("light","dark","eink");
  if(tn==="light"||tn==="dark"||tn==="eink")document.body.classList.add(tn);
  document.body.classList.toggle("lefthand",!!S.leftHand);
  document.body.classList.toggle("accK",S.accent==="black"&&tn!=="eink");
  updatePenBadge();
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=T.paper;
}
function setTheme(v){S.theme=v;saveS();applyTheme();if(layout)show()}

function setLowLat(v){S.lowLat=v;saveS();location.reload()}
if(mq&&mq.addEventListener)mq.addEventListener("change",()=>{if(S.theme==="auto")setTheme("auto")});
let tT=0;function toast(m){const t=document.getElementById("toast");t.textContent=m;placeToast(t);t.style.opacity=1;clearTimeout(tT);tT=setTimeout(()=>t.style.opacity=0,2200)}


/* ================== BẢNG NỔI (Aa, bút nhanh) ================== */
let popKind="";
function closePop(){const L=document.getElementById("popLayer");if(L)L.classList.remove("open");popKind=""}
function openPop(kind,html,anchor,dir){
  const L=document.getElementById("popLayer"),B=document.getElementById("popBox");
  B.innerHTML=html;L.classList.add("open");popKind=kind;
  const tt=document.getElementById("toast");if(tt){tt.style.opacity=0;clearTimeout(tT)}
  const r=anchor.getBoundingClientRect(),bw=B.offsetWidth,bh=B.offsetHeight,vw=innerWidth,vh=innerHeight;
  let x,y;
  if(dir==="up"&&r.height>r.width*.9&&r.left<vw/2-40&&vw>vh){x=r.right+8;y=r.top+r.height/2-bh/2}
  else if(dir==="up"&&vw>vh&&r.left>vw/2){x=r.left-bw-8;y=r.top+r.height/2-bh/2}
  else{x=dir==="down"?r.right-bw:r.left+r.width/2-bw/2;y=dir==="down"?r.bottom+8:r.top-bh-8}
  x=Math.max(8,Math.min(vw-bw-8,x));y=Math.max(8,Math.min(vh-bh-8,y));
  B.style.left=x+"px";B.style.top=y+"px";
}
function openAa(){
  const th=themeName(),acc=S.accent==="black"?"black":"blue";
  const papers=[["sepia","Ấm","#F7F2E7"],["light","Sáng","#FFFFFF"],["dark","Tối","#1B1E23"],["eink","Đen trắng","#FFFFFF"]];
  let h=`<div class="popT">Cỡ dòng kẻ</div>
  <div class="stepRow"><button onclick="stepScale(-0.15);openAa()" aria-label="Thu nhỏ cỡ dòng">${ic("minus")}</button><b>${Math.round(S.scale*100)}%</b><button onclick="stepScale(0.15);openAa()" aria-label="Phóng to cỡ dòng">${ic("plus")}</button></div>
  <div class="popT" style="margin-top:12px">Màu giấy</div>
  <div class="papers4">${papers.map(([v,t,c])=>`<button class="${th===v?"on":""}" onclick="setTheme('${v}');openAa()"><span style="background-color:${c};${v==="eink"?"box-shadow:0 0 0 2px #000":""}"></span>${t}</button>`).join("")}</div>
  <div class="popT" style="margin-top:10px">Màu nhấn</div>
  <div class="popSeg">${[["blue","Xanh mực"],["black","Đen"]].map(([v,t])=>`<button class="${acc===v?"on":""}" onclick="S.accent='${v}';saveS();applyTheme();openAa()">${t}</button>`).join("")}</div>`;
  if(isTablet())h+=`<div class="popT" style="margin-top:10px">Tách đôi màn hình (mẫu bên trái)</div>
  <div class="popSeg">${[[true,"Bật"],[false,"Tắt"]].map(([v,t])=>`<button class="${!!S.split===v?"on":""}" onclick="if(!!S.split!==${v})toggleSplit();setTimeout(openAa,120)">${t}</button>`).join("")}</div>`;
  h+=`<button class="popBtn" onclick="closePop();toggleFocus()">${ic(focusOn?"collapse":"expand")}${focusOn?"Thoát toàn màn hình":"Toàn màn hình, ẩn thanh chế độ"}</button>`;
  openPop("aa",h,document.getElementById("bAa"),"down");
}
function openFavPop(){
  const h=`<div class="popT">Bút yêu thích</div><div class="favPick">${S.favs.map((f,idx)=>{const p=PEN_MAP[f.penType]||PEN_TYPES[0];
    return `<button class="${tool==="pen"&&S.activeFav===idx?"on":""}" onclick="closePop();useFav(${idx})"><span class="fc">${ic(p.ic)}<em style="background:${inkColor(f.color)}"></em></span>${f.name}</button>`}).join("")}</div>
  <button class="popBtn" onclick="closePop();penTap(true)">${ic("sliders")}Chỉnh bút, màu mực, cỡ nét</button>`;
  openPop("fav",h,document.getElementById("bPen"),"up");
}
(function(){const b=document.getElementById("bPen");let t=0,lp=false;
  b.addEventListener("pointerdown",()=>{lp=false;clearTimeout(t);t=setTimeout(()=>{lp=true;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}openFavPop()},450)});
  for(const ev of["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>clearTimeout(t));
  b.addEventListener("click",()=>{if(lp){lp=false;return}penTap()});
})();
window.addEventListener("resize",closePop);

function placeToast(t){try{const r=document.getElementById("canvasWrap").getBoundingClientRect();
  const sheetOpen=!!document.querySelector(".sheet.open");
  if(sheetOpen||r.height<60){t.style.top="calc(env(safe-area-inset-top) + 14px)";t.style.left="50%";t.style.right="auto";t.style.transform="translateX(-50%)";return}
  t.style.transform="none";
  let minL=r.right;for(const id of["redoBtn","grade","cmp"]){const e=document.getElementById(id);if(e&&e.classList.contains("on")){const q=e.getBoundingClientRect();if(q.width)minL=Math.min(minL,S.leftHand?r.right:q.left)}}
  const room=minL-r.left-24;
  if(room>=200){t.style.maxWidth=Math.min(520,room)+"px";t.style.top=(r.top+6)+"px"}else{t.style.maxWidth=Math.min(520,r.width-24)+"px";t.style.top=(r.top+58)+"px"}
  if(S.leftHand){t.style.left="auto";t.style.right=(innerWidth-r.right+12)+"px"}else{t.style.right="auto";t.style.left=(r.left+12)+"px"}}catch(_){}}
/* ================== KHỞI ĐỘNG ================== */
function resize(){
  if(exporting){pendingResize=true;return}
  applySplit();
  const st=document.getElementById("canvasWrap").getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,3);W=Math.max(200,Math.floor(st.width));H=Math.max(120,Math.floor(st.height));
  for(const c of [bg,ink,fx]){c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px"}
  bctx=bg.getContext("2d");
  show();
}
let rT=0;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(resize,150)});
document.addEventListener("contextmenu",e=>e.preventDefault());
(async()=>{
  try{await Promise.all([document.fonts.load("400 20px 'PS'","Tập viết ỡ Ổ"),document.fonts.load("400 20px 'AL'","Tập viết ỡ"),document.fonts.load("500 20px 'QS'","Aăâđ Tập viết ỡ")]);await document.fonts.ready}catch(e){}
  if(SCRIPT==="qs"&&!store.get("importedV3",false)){try{
    const od=localStorage.getItem("tv3:done"),oc=localStorage.getItem("tv3:custom");
    if(od&&!localStorage.getItem("qs1:done")){localStorage.setItem("qs1:done",od);done=new Set(JSON.parse(od))}
    if(oc&&!localStorage.getItem("qs1:custom"))localStorage.setItem("qs1:custom",oc);
    if(od||oc)setTimeout(()=>toast("Đã nhận tiến độ và bài tự do từ bản 3"),1200)}catch(e){}store.set("importedV3",true)}
  /* Đăng ký PWA Manifest động để cài lên màn hình chính Samsung Phone / Galaxy Tab */
  try{
    const mf={name:"Tập viết S Pen",short_name:"Tập viết",display:"standalone",background_color:"#F7F2E7",theme_color:"#F7F2E7"};
    const lk=document.createElement("link");lk.rel="manifest";lk.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(lk);
  }catch(_){}
  if(!GS.get("v45Tip",false)){GS.set("v45Tip",true);setTimeout(()=>toast("Mẹo: mở ① Xem rồi chọn Tự tô từng nét để tập từng nét bằng S Pen"),3800)}
  if(!GS.get("v42Init",false)){S.favBar=false;saveS();GS.set("v42Init",true);setTimeout(()=>toast("Mẹo: giữ lâu nút Bút để chọn nhanh bút yêu thích"),1800)}
  applyTheme();
  resize();
  if(paperDue()&&store.get("paperLast",null))setTimeout(()=>toast("Đã 2 tuần — đến lúc kiểm tra chữ trên giấy (☰ → Kiểm tra trên giấy)"),2500);
  let ok=false;try{localStorage.setItem("td1:probe","1");ok=localStorage.getItem("td1:probe")==="1"}catch(e){}
  if(!ok)document.getElementById("warn").style.display="block";
  if(!store.get("seenGuide3",false)){store.set("seenGuide3",true);setTimeout(openNhapMon,300)}
})();
